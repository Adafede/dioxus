[package]
name = "lotus-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "OpenAPI service for LOTUS explorer search and export workflows"
license = "AGPL-3.0-only"
keywords = ["api", "lotus", "natural-products", "sparql", "wikidata"]
categories = ["science", "web-programming::http-server"]
publish = false

[[bin]]
name = "lotus-api"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
clap = { version = "4.6", features = ["derive", "env"] }
env_logger = { workspace = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
log = { workspace = true }
lotus = { path = "../../crates/lotus", version = "0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
tower = { workspace = true }

[lints]
workspace = true
