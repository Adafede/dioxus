[package]
name = "lotus-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "OpenAPI service for LOTUS explorer search and export workflows"
license = "AGPL-3.0-only"
keywords = ["api", "lotus", "natural-products", "sparql", "wikidata"]
categories = ["science", "web-programming::http-server"]
publish = false

[[bin]]
name = "lotus-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
log = { workspace = true }
lotus = { path = "../../crates/lotus", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.11", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["compression-full", "cors", "request-id", "trace"] }
tracing = "0.1"
urlencoding = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
tower = "0.5"

[lints]
workspace = true
