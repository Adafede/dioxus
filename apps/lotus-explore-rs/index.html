<!DOCTYPE html>
<!--
  Custom HTML template for lotus-explore-rs.
  The Dioxus CLI replaces the following placeholders:
    {app_title}   — the <title> from [web.app.title] in Dioxus.toml
    {app_name}    — package name
    {wasm_path}   — path to the WASM binary (e.g. /./wasm/lotus-explore-rs_bg.wasm)
    {js_path}     — path to the JS bootstrap (e.g. /./wasm/lotus-explore-rs.js)
    {base_path}   — base path (for subpath deployments), no leading/trailing slash

  CSS is loaded via external <link> tags in the initial HTML response,
  BEFORE the WASM bundle. This eliminates the 1-2 s flash-of-unstyled-
  content on mobile that was caused by runtime-injected <style> tags.

  Google Fonts uses the "media swap" technique:
    media="print" onload="this.media='all'"
  This prevents the font stylesheet from blocking rendering while still
  applying the font once loaded.

  NOTE: this file is used verbatim for BOTH `dx serve` and `dx build
  --release` — the CLI does not swap in a separate prod template when a
  custom index.html is present. Do not add dev-only markup (e.g. the
  hot-reload toast) here; it will ship to production as-is.
-->
<html lang="en">
<head>
    <title>{app_title}</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <!-- Preconnect to Google Fonts for faster font CSS fetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- App-wide CSS — loaded in the initial HTML response (no runtime injection) -->
    <link rel="stylesheet" href="/assets/lotus-explore.css">
    <link rel="stylesheet" href="/assets/toast.css">

    <!-- Google Fonts — non-blocking via media="print" trick -->
    <!-- display=swap ensures text remains visible while font loads -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"></noscript>

    <!-- Dioxus CLI injects the <link rel="preload" as="script"> and the
         <script type="module"> tag here automatically. -->
</head>
<body>
<div id="main"></div>
</body>
</html>
