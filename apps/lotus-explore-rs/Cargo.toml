[package]
name = "lotus-explore-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "LOTUS Knowledge Explorer — natural product occurrence explorer"
license = "AGPL-3.0-only"
keywords = ["dioxus", "lotus", "natural-products", "wasm", "wikidata"]
categories = ["science", "wasm", "web-programming"]
build = "build.rs"
publish = false

[package.metadata.dioxus]
wasm-opt = 4

[[bin]]
name = "lotus-explore-rs"
path = "src/main.rs"

[dependencies]
console_log = { workspace = true }
dioxus = { workspace = true }
dioxus-i18n = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
lotus = { path = "../../crates/lotus", version = "0.1" }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ui = { path = "../../crates/ui", version = "0.1" }
upload = { path = "../../crates/upload", version = "0.1" }
urlencoding = { workspace = true }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = {
  workspace = true,
  features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Location",
    "MediaQueryList",
    "Performance",
    "Url",
    "Window",
  ]
}

[lints]
workspace = true
