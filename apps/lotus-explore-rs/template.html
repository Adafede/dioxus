<!DOCTYPE html>
<!--
  Custom HTML template for lotus-explore-rs.
  The Dioxus CLI replaces the following placeholders:
    {app_title}   — the <title> from [web.app.title] in Dioxus.toml
    {app_name}    — package name
    {wasm_path}   — path to the WASM binary (e.g. /./wasm/lotus-explore-rs_bg.wasm)
    {js_path}     — path to the JS bootstrap (e.g. /./wasm/lotus-explore-rs.js)
    {base_path}   — base path (for subpath deployments)

  CSS is loaded via external <link> tags in the initial HTML response,
  BEFORE the WASM bundle.  This eliminates the 1-2 s flash-of-unstyled-
  content on mobile that was caused by runtime-injected <style> tags.

  Google Fonts uses the "media swap" technique:
    media="print" onload="this.media='all'"
  This prevents the font stylesheet from blocking rendering while still
  applying the font once loaded.
-->
<html lang="en">
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">

        <!-- Preconnect to Google Fonts for faster font CSS fetch -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- App-wide CSS — loaded in the initial HTML response (no runtime injection) -->
        <link rel="stylesheet" href="{base_path}assets/lotus-explore.css">
        <link rel="stylesheet" href="{base_path}assets/toast.css">

        <!-- Google Fonts — non-blocking via media="print" trick -->
        <!-- display=swap ensures text remains visible while font loads -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" media="print" onload="this.media='all'">
        <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"></noscript>

        <!-- Dioxus CLI injects the <link rel="preload" as="script"> and the
             <script type="module"> tag here automatically. -->
    </head>
    <body>
        <!-- Toast notification template (used by dev-mode hot-reload) -->
        <div id="__dx-toast" class="dx-toast" aria-hidden="true">
            <div id="__dx-toast-inner" class="dx-toast-inner" style="right:-1000px;">
                <div class="dx-toast-level-bar-container">
                    <div id="__dx-toast-decor" class="dx-toast-level-bar __info"></div>
                </div>
                <div class="dx-toast-content">
                    <div class="dx-toast-header">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" preserveAspectRatio="none">
                            <path d="M22.158 1.783c0 3.077-.851 5.482-2.215 7.377s-3.32 3.557-5.447 5.33-4.425 3.657-6.252 6.195-3.102 5.515-3.102 9.532h4.699c0-3.077.853-5.377 2.217-7.272s3.32-3.557 5.447-5.33 4.425-3.657 6.252-6.195 3.102-5.62 3.102-9.637z" fill="#e96020"/>
                            <path d="M9.531 25.927c-.635 0-1.021.515-1.02.65s.385 1.151 1.02 1.15H22.47a1.151 1.151 0 1 0 0-2.301zm1.361-4.076c-.608 0-.954.558-.953 1.166s.346 1.035.953 1.035h10.217a1.101 1.101 0 1 0 0-2.201zm0-13.594a1.101 1.101 0 1 0 0 2.201h10.217c.607 0 .953-.598.953-1.205s-.345-.996-.953-.996zM9.531 4.021A1.15 1.15 0 0 0 8.38 5.17a1.15 1.15 0 0 0 1.15 1.15h12.94c.635 0 1.021-.498 1.02-1.133s-.386-1.166-1.02-1.166z" fill="#2d323b"/>
                            <path d="M5.142 1.783c0 4.016 1.275 7.099 3.102 9.637s4.125 4.422 6.252 6.195 4.083 3.656 5.447 5.551 2.215 3.974 2.215 7.051h4.701c0-4.016-1.275-7.038-3.102-9.576s-4.125-4.422-6.252-6.195-4.083-3.435-5.447-5.33S9.841 4.86 9.841 1.783z" fill="#00a8d6"/>
                        </svg>
                        <h3 id="__dx-toast-text" class="dx-toast-header-text">Your app is being rebuilt.</h3>
                    </div>
                    <p id="__dx-toast-msg" class="dx-toast-msg">A non-hot-reloadable change occurred and we must rebuild.</p>
                </div>
            </div>
        </div>

        <div id="main"></div>

        <!-- Toast bridge JS (only needed for dev-mode hot-reload notifications;
             the WASM app has its own toast system for production) -->
        <script>
            (function(){
                const STORAGE_KEY = "SCHEDULED-DX-TOAST";
                let currentTimeout = null;
                let currentToastId = 0;

                function showDXToast(headerText, message, progressLevel, durationMs) {
                    const decor = document.getElementById("__dx-toast-decor");
                    const text = document.getElementById("__dx-toast-text");
                    const msg = document.getElementById("__dx-toast-msg");
                    const inner = document.getElementById("__dx-toast-inner");
                    const toast = document.getElementById("__dx-toast");

                    if (decor) decor.className = "dx-toast-level-bar " + progressLevel;
                    if (text) text.innerText = headerText;
                    if (msg) msg.innerText = message;
                    if (inner) inner.style.right = "0";
                    if (toast) {
                        toast.removeAttribute("aria-hidden");
                        toast.addEventListener("click", closeDXToast);
                    }

                    setTimeout(function(){
                        let ourToastId = currentToastId;
                        currentTimeout = setTimeout(closeDXToast, durationMs);
                    }, 100);

                    currentToastId += 1;
                }

                function scheduleDXToast(headerText, message, level, durationMs) {
                    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({headerText, message, level, durationMs}));
                }

                function closeDXToast() {
                    const inner = document.getElementById("__dx-toast-inner");
                    const toast = document.getElementById("__dx-toast");
                    if (inner) inner.style.right = "-1000px";
                    if (toast) toast.setAttribute("aria-hidden", "true");
                    clearTimeout(currentTimeout);
                }

                const potential = sessionStorage.getItem(STORAGE_KEY);
                if (potential) {
                    sessionStorage.removeItem(STORAGE_KEY);
                    const data = JSON.parse(potential);
                    showDXToast(data.headerText, data.message, data.level, data.durationMs);
                }

                window.scheduleDXToast = scheduleDXToast;
                window.showDXToast = showDXToast;
                window.closeDXToast = closeDXToast;
            })();
        </script>
    </body>
</html>
