[application]
name = "lotus-explore-rs"
default_platform = "web"
asset_dir = "public"
# Note: dx ≥ 0.7 writes the web bundle to
#   target/dx/<package-name>/release/web/public/
# and ignores any `out_dir` key set here.

[web.app]
title = "LOTUS Linked Open Data Explorer"
# Set base_path when serving under a subpath, e.g.:
# base_path = "/lotus-explore-rs"

# CSS is now loaded via <link> tags in the custom template.html template
# (apps/lotus-explore-rs/template.html), not via [web.resource.style].
# This template is used in place of the auto-generated one and includes:
#   - /assets/lotus-explore.css  (all app CSS)
#   - /assets/toast.css          (toast notification styles)
#   - Google Fonts               (non-blocking via media="print" trick)
# All stylesheets arrive in the initial HTML response, before WASM downloads.

[web.watcher]
reload_html = true
watch_path = ["src", "public", "../../crates/lotus/src", "../../crates/ui/src", "../../crates/upload/src"]

[[web.proxy]]
# Proxy API requests to the lotus-api backend to avoid CORS issues in development
path = "/v1"
backend = "http://127.0.0.1:8787/v1"
