[package]
name = "cxsmiles-yoga"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Web app for generating CX-SMILES from lists of related structures — collapsing positional isomers (m: blocks) and variable-length repeats (Sg:n: blocks) via maximum common substructure"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["cheminformatics", "cxsmiles", "dioxus", "smiles", "wasm"]
categories = ["science", "wasm", "web-programming"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chem-depict = { path = "../../crates/chem-depict", version = "0.1" }
chematic = { workspace = true, features = ["chem", "fp", "smarts", "smiles"] }
dioxus = { workspace = true }
rustc-hash = { workspace = true }
ui = { path = "../../crates/ui", version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }
web-sys = { workspace = true, features = ["Clipboard", "Navigator"] }

[lints]
workspace = true
