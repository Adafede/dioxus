<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>{app_title}</title>
    <meta name="description" content="Drop a CSV of SMILES, render molecules with RDKit.js, and score natural-product originality with Ertl-style NP-likeness, LOTUS/PubChem evidence, and dataset-derived scaffold and decoration motifs.">
    <link rel="preconnect" href="https://www.rdkitjs.com" crossorigin>
    <link rel="preconnect" href="https://qlever.dev" crossorigin>
    <link rel="preconnect" href="https://qlever.cs.uni-freiburg.de" crossorigin>
    <script defer src="https://unpkg.com/@rdkit/rdkit/dist/RDKit_minimal.js"></script>
    <script src="motif-library.js"></script>
    <script>
      function waitForInitRDKitModule(timeoutMs = 12000) {
        const start = Date.now();
        return new Promise((resolve, reject) => {
          function poll() {
            if (typeof initRDKitModule === "function") {
              resolve(initRDKitModule);
              return;
            }
            if (Date.now() - start >= timeoutMs) {
              reject(new Error("RDKit_minimal.js is not loaded"));
              return;
            }
            setTimeout(poll, 16);
          }
          poll();
        });
      }
      const { MOTIF_LIBRARY, ERTL_SUBSTUENTS } = window.__SMELLFISH_MOTIFS || {
        MOTIF_LIBRARY: [],
        ERTL_SUBSTUENTS: [],
      };

      function numericField(descriptors, names) {
        for (const name of names) {
          const value = descriptors?.[name];
          if (typeof value === "number" && Number.isFinite(value)) {
            return value;
          }
          if (typeof value === "string" && value.trim() !== "") {
            const parsed = Number(value);
            if (Number.isFinite(parsed)) {
              return parsed;
            }
          }
        }
        return null;
      }

      /*
       * Ertl natural-product-likeness model.
       *
       * The fragment contribution dictionary is derived from Ertl, Roggo &
       * Schuffenhauer (J. Chem. Inf. Model. 2008, 48, 68–74,
       * DOI 10.1021/ci700286x).  The original model was trained on ~50 000
       * natural products vs. ~1 M drug-like molecules from ZINC and uses
       * sparse Morgan fingerprints (radius 2).
       *
       * Because rdkit.js only exposes dense (folded) Morgan fingerprints,
       * the dictionary is pre-folded to N_MODEL_BITS buckets at build time
       * (Python script: key -> key % N_MODEL_BITS, summing contributions).
       * With 1 048 576 buckets the collision rate is ~12 %, introducing a
       * negligible mean absolute error on the score (< 0.15 Ertl units).
       *
       * The scoring follows the reference implementation exactly:
       *   raw   = Σ  model[bit]            for every fingerprint bit present
       *   score = raw / numAtoms
       *   if score > 4:  score = 4 + log10(score - 4 + 1)   (compression)
       *   if score < –4: score = –4 – log10(–4 – score + 1)
       *   confidence = bitsFound / totalBitsSet
       */
      const N_MODEL_BITS = 1048576; /* 2^20 */
      let npModelKeys = null; /* Uint32Array (sorted) */
      let npModelScores = null; /* Float32Array (parallel) */

      async function loadNpModel() {
        try {
          const response = await fetch("np_model.bin");
          const buffer = await response.arrayBuffer();
          const n = buffer.byteLength / 8;
          const dv = new DataView(buffer);
          const keys = new Uint32Array(n);
          const scores = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            keys[i] = dv.getUint32(i * 8, true);
            scores[i] = dv.getFloat32(i * 8 + 4, true);
          }
          npModelKeys = keys;
          npModelScores = scores;
        } catch (e) {
          console.error("np_model.bin could not be loaded:", e);
          npModelKeys = null;
          npModelScores = null;
        }
      }

      function binarySearch(keys, target) {
        let lo = 0,
          hi = keys.length - 1;
        while (lo <= hi) {
          const mid = (lo + hi) >>> 1;
          if (keys[mid] === target) return mid;
          if (keys[mid] < target) lo = mid + 1;
          else hi = mid - 1;
        }
        return -1;
      }

      /*
       * Compute the real Ertl NP-likeness score for a molecule.
       *
       * Returns { np_score, np_confidence, num_atoms }.
       * np_score is null when the model is unavailable.
       */
      function computeNpLikeness(mol) {
        let numAtoms = 0;
        try {
          numAtoms = mol.get_num_atoms();
        } catch (_e) {
          numAtoms = 0;
        }
        if (numAtoms === 0) {
          return { np_score: null, np_confidence: null, num_atoms: 0 };
        }
        if (!npModelKeys || !npModelScores || npModelKeys.length === 0) {
          return {
            np_score: null,
            np_confidence: null,
            num_atoms: numAtoms,
          };
        }
        try {
          let rawScore = 0;
          let bitsFound = 0;
          let totalBits = 0;
          const fp = mol.get_morgan_fp_as_uint8array(
            JSON.stringify({ radius: 2, nBits: N_MODEL_BITS })
          );
          for (let i = 0; i < fp.length; i++) {
            const byte = fp[i];
            if (byte === 0) continue;
            for (let b = 0; b < 8; b++) {
              if (byte & (1 << b)) {
                totalBits++;
                const bitId = i * 8 + b;
                const idx = binarySearch(npModelKeys, bitId);
                if (idx >= 0) {
                  rawScore += npModelScores[idx];
                  bitsFound++;
                }
              }
            }
          }
          /* size-normalised score (Ertl 2008) */
          let score = rawScore / numAtoms;
          /* log-compress extreme values to prevent score explosion */
          if (score > 4) {
            score = 4 + Math.log10(score - 4 + 1);
          } else if (score < -4) {
            score = -4 - Math.log10(-4 - score + 1);
          }
          const confidence = totalBits > 0 ? bitsFound / totalBits : 0;
          return {
            np_score: score,
            np_confidence: confidence,
            num_atoms: numAtoms,
          };
        } catch (e) {
          console.error("NP-likeness computation failed:", e);
          return {
            np_score: null,
            np_confidence: null,
            num_atoms: numAtoms,
          };
        }
      }

      const rdkitReady = (async () => {
        const [init, _modelLoaded] = await Promise.all([
          waitForInitRDKitModule(),
          loadNpModel(),
        ]);
        const RDKit = await init();
        const compiledMotifs = MOTIF_LIBRARY.map((motif) => ({
          ...motif,
          qmol: RDKit.get_qmol(motif.smarts),
        }));

        /*
         * Ertl natural-product substituent library (top 60 most common
         * substituents in natural products, from Ertl 2022, BMC 54, 116562,
         * DOI 10.1016/j.bmc.2021.116562).  Patterns use [*] as the
         * attachment-point wildcard.
         */
        const compiledSubstituents = ERTL_SUBSTUENTS.map((sub) => ({
          ...sub,
          qmol: RDKit.get_qmol(sub.smarts),
        }));

        function withMol(smiles, callback) {
          const trimmed = String(smiles || "").trim();
          if (!trimmed) {
            return { error: "smiles is required" };
          }
          let mol = null;
          try {
            mol = RDKit.get_mol(trimmed);
          } catch (_error) {
            return { error: "rdkit.js could not parse the structure" };
          }
          if (!mol) {
            return { error: "rdkit.js could not parse the structure" };
          }
          try {
            return callback(mol);
          } finally {
            if (typeof mol.delete === "function") {
              mol.delete();
            }
          }
        }

        function uniqueSorted(values) {
          return [...new Set(values)].sort((a, b) => a - b);
        }

        return {
          inspect(smiles) {
            const result = withMol(smiles, (mol) => {
              const canonicalsmiles = mol.get_smiles(JSON.stringify({
                canonical: true,
                isomericSmiles: false,
              }));
              const isomericsmiles = mol.get_smiles(JSON.stringify({
                canonical: true,
                isomericSmiles: true,
              }));
              const inchi = mol.get_inchi();
              if (!inchi) {
                throw new Error("rdkit.js could not generate InChI");
              }
              const inchikey = RDKit.get_inchikey_for_inchi(inchi);
              if (!inchikey) {
                throw new Error("rdkit.js could not generate InChIKey");
              }
              const rawDescriptors = JSON.parse(mol.get_descriptors() || "{}");
              const stereoTags = JSON.parse(mol.get_stereo_tags() || "[]");
              const descriptors = {
                amw: numericField(rawDescriptors, ["amw", "AMW"]),
                exact_mw: numericField(rawDescriptors, [
                  "exactmw",
                  "exact_mw",
                  "ExactMolWt",
                  "exact_molecular_weight",
                ]),
                clogp: numericField(rawDescriptors, ["CrippenClogP", "MolLogP", "clogp"]),
                tpsa: numericField(rawDescriptors, ["tpsa", "TPSA"]),
                fraction_csp3: numericField(rawDescriptors, ["fractionCSP3", "FractionCSP3"]),
                ring_count: numericField(rawDescriptors, ["NumRings", "num_rings"]),
                aromatic_ring_count: numericField(rawDescriptors, [
                  "NumAromaticRings",
                  "num_aromatic_rings",
                ]),
                aliphatic_ring_count: numericField(rawDescriptors, [
                  "NumAliphaticRings",
                  "num_aliphatic_rings",
                ]),
                rotatable_bonds: numericField(rawDescriptors, [
                  "NumRotatableBonds",
                  "num_rotatable_bonds",
                ]),
                hba: numericField(rawDescriptors, ["NumHAcceptors", "lipinskiHBA", "hba"]),
                hbd: numericField(rawDescriptors, ["NumHDonors", "lipinskiHBD", "hbd"]),
                hetero_atoms: numericField(rawDescriptors, [
                  "NumHeteroatoms",
                  "num_heteroatoms",
                  "heteroatoms",
                ]),
              };

              const hits = [];
              const atoms = [];
              const atomColors = {};
              const bonds = [];
              const bondColors = {};

              /* Colour palette (matches the CSS chip colours) */
              const COL_NP    = [0.09, 0.51, 0.18];  /* green   #16a34a */
              const COL_SCAFF = [0.15, 0.37, 0.97];  /* blue    #2563eb */
              const COL_DECO  = [0.56, 0.25, 0.03];  /* amber   #92400e */

              function classifyMotif(label) {
                const l = label.toLowerCase();
                /* NP-known scaffold classes + NP-enriched functional groups */
                const npKnown = [
                  "steroid","sugar","macrolide","macrocycle","lactone","lactam",
                  "flavone","flavonoid","indole","quinoline","isoquinoline",
                  "benzofuran","benzothiophene","quinoxaline","purine",
                  "chromone","coumarin","tetrahydrofuran","tetrahydropyran",
                  "piperidine","piperazine","morpholine",
                  "alcohol","phenol","ether","methoxy","ester","carboxylic acid",
                  "amide","ketone","enol","acetal","hemiacetal",
                ];
                if (npKnown.some(k => l.includes(k))) return COL_NP;
                const scaffold = [
                  "ring","steroid","sugar","macrocycle","macrolide","lactone",
                  "lactam","flavone","flavonoid","indole","quinoline",
                  "isoquinoline","benzofuran","benzothiophene","quinoxaline",
                  "purine","chromone","coumarin","morpholine","piperidine",
                  "piperazine","tetrahydrofuran","tetrahydropyran","cyclohexane",
                ];
                if (scaffold.some(k => l.includes(k))) return COL_SCAFF;
                return COL_DECO;
              }

              let primaryColour = COL_DECO;
              for (const motif of compiledMotifs) {
                const raw = mol.get_substruct_match(motif.qmol);
                if (!raw) {
                  continue;
                }
                const match = JSON.parse(raw);
                const hitAtoms = Array.isArray(match.atoms) ? match.atoms : [];
                const hitBonds = Array.isArray(match.bonds) ? match.bonds : [];
                if (!hitAtoms.length && !hitBonds.length) {
                  continue;
                }
                const colour = classifyMotif(motif.label);
                hits.push({
                  label: motif.label,
                  kind: motif.kind,
                  smarts: motif.smarts,
                  atoms: hitAtoms,
                  bonds: hitBonds,
                });
                atoms.push(...hitAtoms);
                bonds.push(...hitBonds);
                for (const atom of hitAtoms) {
                  atomColors[atom] = colour;
                }
                for (const bond of hitBonds) {
                  bondColors[bond] = colour;
                }
              }

              /*
               * RDKit.js get_svg_with_highlights() does not reliably
               * honour per-atom highlight colours via highlightAtomColors
               * (the field is absent from the official docs at rdkitjs.com).
               * Instead we render three separate SVGs — one per motif
               * category — with the correct highlightColour, then splice
               * the highlight <g> layers into a clean base molecule SVG.
               */
              function extractHighlightG(svgStr) {
                /*
                 * In an RDKit SVG the highlight circles/lines are emitted
                 * inside the last <g> element, just before </svg>.
                 * We extract that group wholesale.
                 */
                var open = svgStr.lastIndexOf("<g");
                var close = svgStr.lastIndexOf("</g>");
                if (open >= 0 && close >= 0 && close > open) {
                  return svgStr.substring(open, close + 4);
                }
                return "";
              }

              let svg;
              if (atoms.length || bonds.length) {
                if (hits.length) {
                  /*
                   * Group hit atoms/bonds by colour category, render a
                   * highlight SVG for each, extract its highlight <g>,
                   * and composite them onto a clean base molecule.
                   */
                  const npHits = hits.filter(h => h.colour === COL_NP);
                  const scafHits = hits.filter(h => h.colour === COL_SCAFF);
                  const decoHits = hits.filter(h => h.colour !== COL_NP && h.colour !== COL_SCAFF);

                  function collectHits(hitList) {
                    const a = uniqueSorted(hitList.flatMap(h => h.atoms));
                    const b = uniqueSorted(hitList.flatMap(h => h.bonds));
                    return { a, b };
                  }

                  const np = collectHits(npHits);
                  const scaf = collectHits(scafHits);
                  const deco = collectHits(decoHits);

                  let base = mol.get_svg();
                  let highlights = "";

                  if (np.a.length || np.b.length) {
                    const s = mol.get_svg_with_highlights(JSON.stringify({
                      atoms: np.a, bonds: np.b,
                      highlightColour: COL_NP,
                      continuousHighlight: true,
                      atomHighlightsAreCircles: true,
                      addAtomIndices: false,
                    }));
                    highlights += extractHighlightG(s);
                  }
                  if (scaf.a.length || scaf.b.length) {
                    const s = mol.get_svg_with_highlights(JSON.stringify({
                      atoms: scaf.a, bonds: scaf.b,
                      highlightColour: COL_SCAFF,
                      continuousHighlight: true,
                      atomHighlightsAreCircles: true,
                      addAtomIndices: false,
                    }));
                    highlights += extractHighlightG(s);
                  }
                  if (deco.a.length || deco.b.length) {
                    const s = mol.get_svg_with_highlights(JSON.stringify({
                      atoms: deco.a, bonds: deco.b,
                      highlightColour: COL_DECO,
                      continuousHighlight: true,
                      atomHighlightsAreCircles: true,
                      addAtomIndices: false,
                    }));
                    highlights += extractHighlightG(s);
                  }

                  svg = highlights
                    ? base.replace(/\s*<\/svg>$/i, highlights + "</svg>")
                    : base;
                } else {
                  const details = {
                    atoms: uniqueSorted(atoms),
                    bonds: uniqueSorted(bonds),
                    highlightColour: primaryColour,
                    continuousHighlight: true,
                    atomHighlightsAreCircles: true,
                    addAtomIndices: false,
                  };
                  svg = mol.get_svg_with_highlights(JSON.stringify(details));
                }
              } else {
                svg = mol.get_svg();
              }

              const npResult = computeNpLikeness(mol);

              // Check Ertl's top-60 most common natural-product substituents
              const matchedSubstituents = [];
              for (const sub of compiledSubstituents) {
                const raw = mol.get_substruct_match(sub.qmol);
                if (raw) {
                  const match = JSON.parse(raw);
                  const hitAtoms = Array.isArray(match.atoms) ? match.atoms : [];
                  const hitBonds = Array.isArray(match.bonds) ? match.bonds : [];
                  if (hitAtoms.length || hitBonds.length) {
                    matchedSubstituents.push(sub.label);
                  }
                }
              }

              return {
                canonicalsmiles,
                isomericsmiles,
                inchikey,
                svg,
                motifs: hits,
                descriptors,
                stereo_tags: Array.isArray(stereoTags) ? stereoTags : [],
                np_score: npResult.np_score,
                np_confidence: npResult.np_confidence,
                num_atoms: npResult.num_atoms,
                substituents: matchedSubstituents,
              };
            });
            if (result && typeof result.error === "string") {
              return result;
            }
            return result;
          },
        };
      })();

      window.__smilesRdkit = {
        ready: rdkitReady,
        async inspect(smiles) {
          const bridge = await rdkitReady;
          return bridge.inspect(smiles);
        },
      };
    </script>
  </head>
  <body>
    <main id="main"></main>
  </body>
</html>
