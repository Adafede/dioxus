[package]
name = "smellfish-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Smellfish-rs literature-backed NP-likeness scoring with RDKit.js, QLever enrichment, and explicit endpoint health checks"
license = "AGPL-3.0-only"
keywords = ["dioxus", "qlever", "rdkit", "smiles", "sparql"]
categories = ["science", "wasm", "web-programming"]
build = "build.rs"
publish = false

[[bin]]
name = "smellfish-rs"
path = "src/main.rs"

[dependencies]
csv = { workspace = true }
dioxus = { workspace = true }
futures = { workspace = true }
lotus = { path = "../../crates/lotus", version = "0.1" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ui = { path = "../../crates/ui", version = "0.1" }
urlencoding = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "File", "FileList", "HtmlInputElement", "Window"] }

[lints]
workspace = true
