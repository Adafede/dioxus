[package]
name = "smellfish-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Smellfish-rs literature-backed NP-likeness scoring with RDKit.js, QLever enrichment, and explicit endpoint health checks"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["dioxus", "qlever", "rdkit", "smiles", "sparql"]
categories = ["science", "wasm", "web-programming"]
build = "build.rs"
publish = false

[[bin]]
name = "smellfish-rs"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true }
smellfish-core = { path = "../../crates/smellfish-core", version = "0.1" }
ui = { path = "../../crates/ui", version = "0.1" }
upload = { path = "../../crates/upload", version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
lotus-search = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

[lints]
workspace = true
