[package]
name = "smellfish-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Smellfish-rs literature-backed NP-likeness scoring with RDKit.js, QLever enrichment, and explicit endpoint health checks"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["dioxus", "qlever", "rdkit", "smiles", "sparql"]
categories = ["science", "wasm", "web-programming"]
build = "build.rs"
publish = false

[[bin]]
name = "smellfish-rs"
path = "src/main.rs"

[dependencies]
csv = { workspace = true }
dioxus = { workspace = true }
futures = { workspace = true }
# The single `lotus` crate this app used to depend on was split upstream into
# `lotus-model` (types), `lotus-query` (pure query building and parsing) and
# `lotus-search` (the transport and the decisions around it). Only `lotus-search`
# is reachable from here: this app builds its own queries and parses its own
# results, so it needs neither the LOTUS vocabulary nor the LOTUS ones.
lotus-search = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ui = { path = "../../crates/ui", version = "0.1" }
urlencoding = { workspace = true }

[dev-dependencies]
# `lotus-search`'s scripted transport, so the SPARQL layer can be tested against
# a recorded conversation instead of a live endpoint. The feature is off by
# default upstream precisely because a test double is not part of a consumer's
# API; enabling it from a dev-dependency is the intended way in.
lotus-search = { workspace = true, features = ["testing"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "File", "FileList", "HtmlInputElement", "Window"] }

[lints]
workspace = true
