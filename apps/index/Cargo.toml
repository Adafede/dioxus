[package]
name = "index"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Landing page for Dioxus experiments — accessible, type-safe, showcasing best practices"
license = "AGPL-3.0-only"
keywords = ["accessibility", "dioxus", "landing", "wasm", "web"]
categories = ["wasm", "web-programming"]
publish = false

[[bin]]
name = "index"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true }
ui = { path = "../../crates/ui", version = "0.1" }

[lints]
workspace = true

# ── Release profile — tiny WASM ───────────────────────────────────────────────
[profile.release]
opt-level = "z"
debug = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
