[package]
name = "smarts-evoliposuction"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "Batch SMARTS evolution runner for lipid class classification using smarts-evolution by Luca Cappelletti"
repository = "https://github.com/Adafede/dioxus"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "smarts-evoliposuction"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
rand = "0.10"
rayon = "1.12"
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
zip = "9.0"

# External crates by Luca Cappelletti (@LucaCappelletti94) / Earth Metabolome Initiative
# See README.md for full credit and links.
#
# `smarts-rs` is declared as `branch = "main"` rather than pinned to a `rev`
# because `smarts-evolution` declares it that way, and Cargo treats two source
# specs as two packages even at the same commit: pinning ours to `rev = ...`
# while upstream floats on `branch = main` puts two `smarts_rs` in one graph and
# `PreparedTarget` from one is not the type `FoldSample` expects from the other.
# Matching the spec upstream uses keeps exactly one. The resolved commit is in
# `Cargo.lock`, so `--locked` builds stay reproducible; only `cargo update` can
# move it, which is the ordinary Cargo guarantee and not something a `rev`
# achieves here.
smarts-evolution = { git = "https://github.com/earth-metabolome-initiative/smarts-evolution", branch = "main", version = "0.1", features = ["tui"] }
smarts-rs = { git = "https://github.com/earth-metabolome-initiative/smarts-rs", branch = "main", version = "0.1" }

# `smiles-rs` comes from crates.io, not from git, because `smarts-rs` takes it
# from there: `smarts-rs` declares `smiles-rs = "0.1.5"` with no git source, so
# depending on the git checkout as well put two different crates named
# `smiles_rs` in one graph. They are distinct types, and passing a git-`Smiles`
# to `PreparedTarget::new`, which wants the crates.io one, is a type error whose
# only note is "there are multiple different versions of crate `smiles_rs` in
# the dependency graph".
smiles-rs = "0.1.5"

[dev-dependencies]
tempfile = "3.27"

# The workspace's lint table, restated rather than inherited. `#[expect(...)]`
# attributes in this crate's test modules were added against these, so they are
# load-bearing: relaxing one of these fails the build rather than the lint.
[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
cargo_common_metadata = "warn"
cast_lossless = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "warn"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
default_trait_access = "deny"
derive_partial_eq_without_eq = "deny"
doc_markdown = "deny"
duration_suboptimal_units = "deny"
expect_used = "deny"
explicit_iter_loop = "deny"
float_cmp = "deny"
fn_params_excessive_bools = "deny"
format_push_string = "deny"
future_not_send = "deny"
if_not_else = "deny"
ignored_unit_patterns = "deny"
indexing_slicing = "deny"
items_after_statements = "deny"
large_types_passed_by_value = "deny"
lint_groups_priority = "warn"
manual_let_else = "deny"
manual_string_new = "deny"
map_unwrap_or = "deny"
match_same_arms = "deny"
missing_assert_message = "deny"
missing_const_for_fn = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "warn"
multiple_crate_versions = "allow"
must_use_candidate = "deny"
needless_lifetimes = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "deny"
no_effect_underscore_binding = "deny"
nursery = { level = "warn", priority = -1 }
option_as_ref_cloned = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
panic = "deny"
pedantic = { level = "deny", priority = -1 }
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_pub_crate = "allow"
semicolon_if_nothing_returned = "deny"
significant_drop_tightening = "deny"
similar_names = "warn"
single_match_else = "deny"
single_option_map = "deny"
struct_excessive_bools = "deny"
struct_field_names = "deny"
suboptimal_flops = "allow"
todo = "deny"
too_many_lines = "warn"
trivially_copy_pass_by_ref = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unicode_not_nfc = "deny"
unimplemented = "deny"
uninlined_format_args = "deny"
unnecessary_struct_initialization = "deny"
unnecessary_wraps = "deny"
unnested_or_patterns = "deny"
unreadable_literal = "deny"
unused_async = "deny"
unused_self = "deny"
unwrap_used = "deny"
use_self = "deny"
wildcard_imports = "warn"

[lints.rust]
dead_code = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.rustdoc]
bare_urls = "warn"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

# Deliberately NOT a workspace member; see `exclude` in the root `Cargo.toml` for
# why. That means no `workspace = true` inheritance and no shared lint table --
# both of which require being a member -- so every value this crate needs is
# spelled out here instead. It is a standalone binary crate with its own
# `Cargo.lock`.
#
# Opts this crate out of the parent workspace from the inside. `exclude` in the
# root `Cargo.toml` covers the other direction -- it stops this path being pulled
# in as a member -- but Cargo still walks up from this directory, finds the root
# `[workspace]`, finds this package is not a member, and refuses: "current
# package believes it's in a workspace when it's not". This table is what makes
# `cargo build` work here.
[workspace]
