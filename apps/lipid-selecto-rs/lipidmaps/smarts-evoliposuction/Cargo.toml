[package]
name = "smarts-evoliposuction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Batch SMARTS evolution runner for lipid class classification using smarts-evolution by Luca Cappelletti"
documentation = "https://docs.rs/smarts-evoliposuction"
repository = "https://github.com/earth-metabolome-initiative/smarts-evolution"
license.workspace = true
publish = false

[[bin]]
name = "smarts-evoliposuction"
path = "src/main.rs"

[dependencies]
lipidsdl = { path = "../../../../crates/lipidsdl", version = "0.1.0" }

clap = { workspace = true }
csv.workspace = true
rand.workspace = true
rayon = { workspace = true }
serde.workspace = true

# External crates by Luca Cappelletti (@LucaCappelletti94) / Earth Metabolome Initiative
# See README.md for full credit and links.
smarts-evolution = { git = "https://github.com/earth-metabolome-initiative/smarts-evolution", branch = "main", version = "0.1.0", features = ["tui"] }
smarts-rs = { git = "https://github.com/earth-metabolome-initiative/smarts-rs", branch = "main", version = "0.1.0" }
smiles-parser = { git = "https://github.com/earth-metabolome-initiative/smiles-parser", branch = "main", version = "0.1.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["blocking"] }
thiserror.workspace = true
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true

[features]
default = []

[lints]
workspace = true
