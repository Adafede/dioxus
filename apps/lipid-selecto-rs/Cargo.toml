[package]
name = "lipid-selecto-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Web app for filtering lipid mass spectrometry data by chemical class with interactive structure visualization"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["dioxus", "lipid", "lipidomics", "mass-spectrometry", "wasm"]
categories = ["science", "wasm", "web-programming"]
publish = false

[dependencies]
chematic = { workspace = true, features = ["chem", "smarts", "smiles"] }
dioxus = { workspace = true }
mgf = { path = "../../crates/mgf", version = "0.1" }
ui = { path = "../../crates/ui", version = "0.1" }
upload = { path = "../../crates/upload", version = "0.1" }

[dev-dependencies]
chem-depict = { path = "../../crates/chem-depict", version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chem-depict = { path = "../../crates/chem-depict", version = "0.1" }
gloo-timers = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

[lints]
workspace = true
