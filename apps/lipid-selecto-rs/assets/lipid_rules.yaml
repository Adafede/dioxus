# Lipid Classification Rules (LIPID MAPS-aligned)
#
# This file documents the full LIPID MAPS structural classification tree
# (8 categories, 50+ main classes) with SMARTS patterns curated from
# `smarts-evoliposuction` (evolved) or best-possible approximative placeholders.
#
# Colors follow the microshades palette system:
#   FA → cvd_green (#4E7705), GL → cvd_blue (#098BD9), GP → cvd_purple (#7D3560),
#   SP → cvd_orange (#9D654C), ST → green (#238b45), PR → blue (#4292c6),
#   SL → purple (#6a51a3), PK → orange (#ff7f00).
#
# Family-level entries use shade 0 (darkest). Subclasses use progressively
# lighter shades (1-4) within the family palette.

families:
  FA: "Fatty Acyls"
  GL: "Glycerolipids"
  GP: "Glycerophospholipids"
  SP: "Sphingolipids"
  ST: "Sterol Lipids"
  PR: "Prenol Lipids"
  SL: "Saccharolipids"
  PK: "Polyketides"

architectures:
  DiAcyl: "Two ester or ester/amide linkages"
  MonoAcyl: "One ester linkage (lyso)"
  AlkylAcyl: "Ether + ester"
  Plasmalogen: "Vinyl ether + ester"
  DiEther: "Two ether linkages"
  TriAcylGlycerol: "Three ester linkages"
  Ceramide: "Amide linkage to sphingoid base"
  Steroid: "Tetracyclic ring system"
  Isoprenoid: "Isoprene-derived conjugated diene"
  Acyclic: "No ring system"

# === Fatty Acyls (FA) — cvd_green palette ===
