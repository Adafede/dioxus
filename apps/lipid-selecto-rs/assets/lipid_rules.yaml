# Common-sense filters: N=0, P=0, aromatic_ring_count=0
  - name: "ST"
    family: "ST"
    architecture: "Steroid"
    description: "Sterol lipids - tetracyclic steroid core"
    smarts: "[*;R2]"
    color: "#238b45"
    priority: 10

  - name: "ST02"
    family: "ST"
    architecture: "Steroid"
    description: "Bile acids"
    smarts: "[*;R2]"
    color: "#41ab5d"
    priority: 7

  - name: "ST03"
    family: "ST"
    architecture: "Steroid"
    description: " steroids (precursors/metabolites)"
    smarts: "[*;R2]"
    color: "#74c476"
    priority: 6

  - name: "ST05"
    family: "ST"
    architecture: "Steroid"
    description: " Cytosterols (cholesterol, cholesteryl esters, etc.)"
    smarts: "[*;R2]"
    color: "#a1d99b"
