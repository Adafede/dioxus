# Lipid Classification Rules (LIPID MAPS-aligned)
#
# Full LIPID MAPS Structure Database (LMSD) main-class tree (8 categories,
# 86 main classes) with SMARTS patterns evolved via `smarts-evoliposuction`.

families:
  FA: "Fatty Acyls"
  GL: "Glycerolipids"
  GP: "Glycerophospholipids"
  SP: "Sphingolipids"
  ST: "Sterol Lipids"
  PR: "Prenol Lipids"
  SL: "Saccharolipids"
  PK: "Polyketides"

lipid_classes:
  - name: "FA01"
    family: "FA"
    description: "Fatty Acids and Conjugates [FA01] (3102 LMSD structures)"
    smarts: "[#6;A;!R]~[#6;A;!R]~[#6;A;!R]~[#6;A;!R]~[#6;A;!R]~[#6;A;!R][CX3](=[OX1])[OX2H1,OX1-]"
    color: "#4E7705"

  - name: "FA07"
    family: "FA"
    description: "Fatty esters [FA07] (2454 LMSD structures)"
    smarts: "[#6;A;!R]~[#6;A;!R]~[#6;A;!R]~[#6;A;!R]~[#6;A;!R][CX3](=[OX1])[OX2][#6]"
    color: "#6D9F06"

  - name: "FA03"
    family: "FA"
    description: "Eicosanoids [FA03] (1381 LMSD structures)"
    smarts: "[CX3](=[OX1])[OX2H1,OX1-,OX2,NX3].*=C.*(-[H2])-[H2].[#6&r5]"
    color: "#97CE2F"

  - name: "FA04"
    family: "FA"
    description: "Docosanoids [FA04] (1191 LMSD structures)"
    smarts: "[CX3](=[OX1])[OX2H1,OX1-,OX2,NX3].*=[!224*]-[#6].C=[!234*]!@[!#7]-[!#6].[$([#6]~[#8])&r5]"
    color: "#BDEC6F"

  - name: "FA02"
