    architecture: "Steroid"
    description: " Carotenoid derivatives"
    smarts: "C=CC=CC=C"
    color: "#238b45"
    priority: 4

# === Prenol Lipids (PR) — blue palette ===
# Evolved SMARTS: C=CC=CC=C (MCC=0.871) — conjugated triene system
# Common-sense filters: no phosphorus, no fatty acyl pattern, no aromatic rings
  - name: "PR"
    family: "PR"
    architecture: "Isoprenoid"
    description: "Prenol lipids - isoprenoid/conjugated diene system"
    smarts: "C=CC=CC=C"
    color: "#4292c6"
    priority: 8

  - name: "PR02"
    family: "PR"
    architecture: "Isoprenoid"
    description: " Isoprenoids (sesquiterpenes, etc.)"
    smarts: "[*;R1]1[CH;R1][CH;R1][CH;R1][CH;R1][CH;R1]1"
    color: "#6baed6"
    priority: 6

  # PR additional prenol subclasses
  - name: "PR01"
    family: "PR"
    architecture: "Isoprenoid"
    description: "Coenzyme Q, dolichols and other prenyl derivatives"
    smarts: "C=CC=CC=C"
    color: "#9ecae1"
