# === Glycerolipids (GL) — cvd_blue palette ===
# Evolved SMARTS: [CX3](=[OX1])[OX2][#6;!a;!R] (MCC=0.9146)
# Common-sense filter: no nitrogen or phosphorus.
  - name: "TG(AAA)"
    family: "GL"
    architecture: "TriAcylGlycerol"
    description: "Triacylglycerol with three acyl groups"
    smarts: "[CX4]([OX2][CX3](=[OX1])[#6])([OX2][CX3](=[OX1])[#6])[OX2][CX3](=[OX1])[#6]"
    color: "#098BD9"
    priority: 8

  - name: "DG(AA)"
    family: "GL"
    architecture: "DiAcyl"
    description: "Diacylglycerol with two acyl groups"
    smarts: "[CX4]([OX2][CX3](=[OX1])[#6])[OX2][CX3](=[OX1])[#6]"
    color: "#56B4E9"
    priority: 7

  - name: "MG(A)"
    family: "GL"
    architecture: "MonoAcyl"
    description: "Monoacylglycerol with one acyl group"
    smarts: "[CH2X4][CHX4][CH2X4][OX2][CX3](=[OX1])[#6]"
    color: "#7DCCFF"
    priority: 6

  # GL03: Monoglyceride subclasses
  - name: "LPI"
    family: "GL"
    architecture: "MonoAcyl"
    description: "Lysophosphatidic acid (monoacylglycerol phosphate)"
    smarts: "[CH2X4][CHX4][CH2X4][OX2][PX4](=[OX1])([OX2])([OX2])]"
    color: "#BCE1FF"
    priority: 5

