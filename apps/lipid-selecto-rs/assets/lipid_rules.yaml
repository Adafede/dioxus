# === Saccharolipids (SL) — purple palette ===
# Placeholder SMARTS: [*;R1]1[CH;R1][CH;R1][CH;R1][CH;R1][CH;R1]1 — 6-membered ring
# Common-sense filter: must have phosphorus (phosphate-linked sugar)
  - name: "SL"
    family: "SL"
    architecture: " Acyclic"
    description: "Saccharolipids - sugar-phosphate lipids"
    smarts: "[*;R1]1[CH;R1][CH;R1][CH;R1][CH;R1][CH;R1]1"
    color: "#6a51a3"
    priority: 6

  - name: "SL01"
    family: "SL"
    architecture: " Acyclic"
    description: " Acylaminosugars"
    smarts: "[CX3](=[OX1])[OX2][#6;!a;!R]"
    color: "#807dba"
    priority: 5

  - name: "SL02"
    family: "SL"
    architecture: " Acyclic"
    description: " Lipid phosphorylated headgroups (Lipid I, II)"
    smarts: "[PX4](=[OX1])([OX2])([OX2])"
    color: "#9e9ac8"
    priority: 5

# === Polyketides (PK) — orange palette ===
# Evolved SMARTS: [CX3](=[OX1])([#6;!a;!R])[#6;!a;!R]~[#6;!a;!R]~[#6;!a;!R] (MCC=0.9544)
# This requires a ketone (carbonyl C with two aliphatic C neighbors) + two more aliphatic Cs
# Common-sense filter: not a fatty acid, not aromatic, not in rings
  - name: "PK"
    family: "PK"
    architecture: " Acyclic"
    description: "Polyketides - ketone + aliphatic chain, acyclic"
    smarts: "[CX3](=[OX1])([#6;!a;!R])[#6;!a;!R]~[#6;!a;!R]~[#6;!a;!R]"
    color: "#ff7f00"
    priority: 7

  - name: "PK03"
    family: "PK"
    architecture: " Acyclic"
    description: " Macrocyclic polyketides"
    smarts: "[CX3](=[OX1])([#6;!a;!R])[#6;!a;!R]~[#6;!a;!R]~[#6;!a;!R]"
    color: "#fe9929"
    priority: 5

  - name: "PK04"
    family: "PK"
    architecture: " Acyclic"
    description: " Meroterpenoids"
    smarts: "[CX3](=[OX1])([#6;!a;!R])[#6;!a;!R]~[#6;!a;!R]~[#6;!a;!R]"
    color: "#fdae6b"
