    description: "Hydrocarbons [FA11] (701 LMSD structures)"
    smarts: "[CH2X4;!R][CH2X4;!R][CH2X4;!R][CH2X4;!R][CH2X4;!R][CH2X4;!R][CH3X4;!R]"
    color: "#DDFFA0"

  - name: "FA08"
    family: "FA"
    description: "Fatty amides [FA08] (599 LMSD structures)"
