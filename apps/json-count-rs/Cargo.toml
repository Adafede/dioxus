[package]
name = "json-count-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Web app for counting non-null JSON fields from uploaded files"
license = "AGPL-3.0-only"
keywords = ["dioxus", "json", "wasm", "web"]
categories = ["wasm", "web-programming"]
publish = false

[[bin]]
name = "json-count-rs"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true }
ui = { path = "../../crates/ui", version = "0.1" }
upload = { path = "../../crates/upload", version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "File", "FileList", "FileReader", "HtmlInputElement"] }

[lints]
workspace = true

