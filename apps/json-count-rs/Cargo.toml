[package]
name = "json-count-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Web app for counting non-null JSON fields from uploaded files"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["dioxus", "json", "wasm", "web"]
categories = ["wasm", "web-programming"]
publish = false

[[bin]]
name = "json-count-rs"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true }
json-count-core = { path = "../../crates/json-count-core", version = "0.1" }
ui = { path = "../../crates/ui", version = "0.1" }
upload = { path = "../../crates/upload", version = "0.1" }

[lints]
workspace = true
