[package]
name = "mgf-precursor-erro-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Web app for summarizing precursor mass errors from uploaded MGF files"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["dioxus", "mass-spectrometry", "mgf", "precursor", "wasm"]
categories = ["science", "wasm", "web-programming"]
publish = false

[[bin]]
name = "mgf-precursor-erro-rs"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true }
mgf-analysis-core = { path = "../../crates/mgf-analysis-core", version = "0.1" }
plotters = { version = "0.3", default-features = false, features = ["line_series", "point_series", "svg_backend"] }
prismatica = { version = "1.0", default-features = false, features = ["crameri"] }
thiserror = { workspace = true }
ui = { path = "../../crates/ui", version = "0.1" }
upload = { path = "../../crates/upload", version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
stream-io = { path = "../../crates/stream-io", version = "0.1" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Response"] }

[lints]
workspace = true
