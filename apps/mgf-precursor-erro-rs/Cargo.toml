[package]
name = "mgf-precursor-erro-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Web app for summarizing precursor mass errors from uploaded MGF files"
license = "AGPL-3.0-only"
keywords = ["dioxus", "wasm", "mgf", "precursor", "mass-spectrometry"]
categories = ["wasm", "web-programming"]
publish = false

[[bin]]
name = "mgf-precursor-erro-rs"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true }
gloo-timers = { version = "0.4", features = ["futures"] }
mascot-rs = { git = "https://github.com/earth-metabolome-initiative/mascot-rs.git", branch = "main", default-features = false }
molecular-formulas-010 = { package = "molecular-formulas", version = "0.1.10", default-features = false }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Blob", "File", "FileList", "FileReader", "HtmlInputElement"] }

[lints]
workspace = true
