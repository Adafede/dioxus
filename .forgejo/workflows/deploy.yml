name: Deploy to Codeberg Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  # Pre-build workspace tools so app build jobs don't compile native binaries sequentially
  build-fetch-ketcher:
    name: Build fetch-ketcher tool
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: tool-ketcher
      - name: Compile tool binary
        run: cargo build --release -p lotus-deploy --bin fetch-ketcher
      - uses: https://github.com/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fetch-ketcher-bin
          path: target/release/fetch-ketcher

  # Parallel Job 1: Index
  build-index:
    name: Build index
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: app-index
      - uses: https://github.com/cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa
      - name: Install dioxus-cli
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build App
        working-directory: apps/index
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/"
      - uses: https://github.com/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-index
          path: target/dx/index/release/web/public

  # Parallel Job 2: Lotus Explore (Downloads prebuilt tool)
  build-lotus-explore-rs:
    name: Build lotus-explore-rs
    needs: build-fetch-ketcher
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: app-lotus-explore-rs
      - uses: https://github.com/cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa
      - name: Install dioxus-cli
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: https://github.com/actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fetch-ketcher-bin
          path: bin-tool
      - name: Fetch Ketcher Assets
        working-directory: apps/lotus-explore-rs
        run: |
          chmod +x ../../bin-tool/fetch-ketcher
          ../../bin-tool/fetch-ketcher
      - name: Build App
        working-directory: apps/lotus-explore-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/lotus-explore-rs/"
      - uses: https://github.com/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-lotus-explore-rs
          path: target/dx/lotus-explore-rs/release/web/public

  # Parallel Job 3: JSON Count
  build-json-count-rs:
    name: Build json-count-rs
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: app-json-count-rs
      - uses: https://github.com/cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa
      - name: Install dioxus-cli
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build App
        working-directory: apps/json-count-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/json-count-rs/"
      - uses: https://github.com/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-json-count-rs
          path: target/dx/json-count-rs/release/web/public

  # Parallel Job 4: MGF Precursor Error
  build-mgf-precursor-erro-rs:
    name: Build mgf-precursor-erro-rs
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: app-mgf-precursor-erro-rs
      - uses: https://github.com/cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa
      - name: Install dioxus-cli
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build App
        working-directory: apps/mgf-precursor-erro-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/mgf-precursor-erro-rs/"
      - uses: https://github.com/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-mgf-precursor-erro-rs
          path: target/dx/mgf-precursor-erro-rs/release/web/public

  # Parallel Job 5: Smellfish
  build-smellfish-rs:
    name: Build smellfish-rs
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: app-smellfish-rs
      - uses: https://github.com/cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa
      - name: Install dioxus-cli
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build App
        working-directory: apps/smellfish-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/smellfish-rs/"
      - uses: https://github.com/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-smellfish-rs
          path: target/dx/smellfish-rs/release/web/public

  # Parallel Job 6: Lipid Selecto
  build-lipid-selecto-rs:
    name: Build lipid-selecto-rs
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: app-lipid-selecto-rs
      - uses: https://github.com/cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa
      - name: Install dioxus-cli
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Build App
        working-directory: apps/lipid-selecto-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/lipid-selecto-rs/"
      - uses: https://github.com/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-lipid-selecto-rs
          path: target/dx/lipid-selecto-rs/release/web/public

  # Assembly & Deployment Step
  deploy:
    needs:
      - build-index
      - build-lotus-explore-rs
      - build-json-count-rs
      - build-mgf-precursor-erro-rs
      - build-smellfish-rs
      - build-lipid-selecto-rs
    runs-on: codeberg-small
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: raw_artifacts
      - name: Assemble Site Layout
        run: |
          mkdir -p _site
          cp -r raw_artifacts/app-index/* _site/
          
          for dir in raw_artifacts/app-*; do
            folder_name="${dir#raw_artifacts/app-}"
            if [ "$folder_name" != "index" ]; then
              mv "$dir" "_site/$folder_name"
            fi
          done
      - uses: actions/git-pages@v2
        with:
          site: https://adafede.codeberg.page/dioxus/
          token: ${{ forge.token }}
          source: _site/
