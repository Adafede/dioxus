name: Deploy to Codeberg Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: "build and deploy"
    runs-on: codeberg-medium
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: https://github.com/cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --version 0.7.10 --locked --force

      - name: Fetch Ketcher (115 MB structure editor)
        working-directory: apps/lotus-explore-rs
        run: bash scripts/fetch-ketcher.sh

      - name: Build index landing page
        working-directory: apps/index
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/"

      - name: Build lotus-explore-rs
        working-directory: apps/lotus-explore-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/lotus-explore-rs/"

      - name: Build json-count-rs
        working-directory: apps/json-count-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/json-count-rs/"

      - name: Build mgf-precursor-erro-rs
        working-directory: apps/mgf-precursor-erro-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/mgf-precursor-erro-rs/"

      - name: Build smellfish-rs
        working-directory: apps/smellfish-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/smellfish-rs/"

      - name: Build lipid-selecto-rs
        working-directory: apps/lipid-selecto-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/dioxus/lipid-selecto-rs/"

      - name: Assemble site
        run: |
          DX_OUT="target/dx"
          DX_WEB="release/web/public"
          mkdir -p _site
          cp -r "$DX_OUT/index/$DX_WEB"/* _site/
          cp -r "$DX_OUT/lotus-explore-rs/$DX_WEB" _site/lotus-explore-rs
          cp -r "$DX_OUT/json-count-rs/$DX_WEB"    _site/json-count-rs
          cp -r "$DX_OUT/mgf-precursor-erro-rs/$DX_WEB" _site/mgf-precursor-erro-rs
          cp -r "$DX_OUT/smellfish-rs/$DX_WEB" _site/smellfish-rs
          cp -r "$DX_OUT/lipid-selecto-rs/$DX_WEB" _site/lipid-selecto-rs

      - uses: actions/git-pages@v2
        with:
          site: https://adafede.codeberg.page/dioxus/
          token: ${{ forge.token }}
          source: _site/
