name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-apps:
    runs-on: codeberg-medium
    strategy:
      matrix:
        include:
          - app: index
            path: "/${REPONAME}/"
            dir: "apps/index"
            pkg: "index"
          - app: lotus-explore-rs
            path: "/${REPONAME}/lotus-explore-rs/"
            dir: "apps/lotus-explore-rs/lotus-explore-rs"
            pkg: "lotus-explore-rs"
          - app: json-count-rs
            path: "/${REPONAME}/json-count-rs/"
            dir: "apps/json-count-rs"
            pkg: "json-count-rs"
          - app: mgf-precursor-erro-rs
            path: "/${REPONAME}/mgf-precursor-erro-rs/"
            dir: "apps/mgf-precursor-erro-rs"
            pkg: "mgf-precursor-erro-rs"
          - app: smellfish-rs
            path: "/${REPONAME}/smellfish-rs/"
            dir: "apps/smellfish-rs"
            pkg: "smellfish-rs"
          - app: lipid-selecto-rs
            path: "/${REPONAME}/lipid-selecto-rs/"
            dir: "apps/lipid-selecto-rs"
            pkg: "lipid-selecto-rs"
    steps:
      - uses: actions/checkout@v4

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.app }}

      - uses: https://github.com/cargo-bins/cargo-binstall@v1.18.1

      - name: Install dioxus-cli
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Only run fetch-ketcher for the app that actually uses it
      - name: Fetch Ketcher (lotus-explore-rs only)
        if: matrix.app == 'lotus-explore-rs'
        run: |
          cargo build --release -p lotus-deploy --bin fetch-ketcher
          ../../target/release/fetch-ketcher
        working-directory: apps/lotus-explore-rs

      - name: Build App
        run: |
          REPONAME="${GITHUB_REPOSITORY#*/}"
          EVAL_PATH=$(eval echo "${{ matrix.path }}")
          dx build --release --platform web --debug-symbols false --base-path "$EVAL_PATH" --package ${{ matrix.pkg }}
        working-directory: ${{ matrix.dir }}

      - uses: actions/upload-artifact@v3
        with:
          name: app-${{ matrix.app }}
          path: target/dx/${{ matrix.pkg }}/release/web/public

  deploy:
    needs: build-apps
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v3
        with:
          path: _site

      - name: Structure _site directory
        run: |
          mkdir -p _final_site

          # Move base index contents to root of final site directory
          cp -r _site/app-index/* _final_site/
          rm -rf _site/app-index

          # Move remaining apps to subdirectories
          for dir in _site/app-*; do
            app_name="${dir#_site/app-}"
            mv "$dir" "_final_site/$app_name"
          done

      - uses: actions/git-pages@v2
        with:
          site: https://adafede.codeberg.page/dioxus/
          token: ${{ forge.token }}
          source: _final_site/
