name: Deploy to Codeberg Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  prepare-tools:
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: https://github.com/cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa
      - name: Install dioxus-cli & build fetch-ketcher
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm
          cargo build --release -p lotus-deploy --bin fetch-ketcher
          
          mkdir -p bin-tools
          cp $HOME/.cargo/bin/dx bin-tools/
          cp target/release/fetch-ketcher bin-tools/
      - uses: actions/upload-artifact@v2
        with:
          name: pipeline-tools
          path: bin-tools/

  build-apps:
    needs: prepare-tools
    runs-on: codeberg-medium
    strategy:
      matrix:
        include:
          - app: index
            path: "/dioxus/"
          - app: lotus-explore-rs
            path: "/dioxus/lotus-explore-rs/"
          - app: json-count-rs
            path: "/dioxus/json-count-rs/"
          - app: mgf-precursor-erro-rs
            path: "/dioxus/mgf-precursor-erro-rs/"
          - app: smellfish-rs
            path: "/dioxus/smellfish-rs/"
          - app: lipid-selecto-rs
            path: "/dioxus/lipid-selecto-rs/"
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.app }}
      - uses: actions/download-artifact@v2
        with:
          name: pipeline-tools
          path: bin-tools
      - name: Setup tools in PATH
        run: |
          chmod +x bin-tools/*
          echo "$GITHUB_WORKSPACE/bin-tools" >> $GITHUB_PATH
      - name: Fetch Ketcher Assets
        if: matrix.app == 'lotus-explore-rs'
        working-directory: apps/lotus-explore-rs
        run: fetch-ketcher
      - name: Build App
        working-directory: apps/${{ matrix.app }}
        run: dx build --release --platform web --debug-symbols false --base-path "${{ matrix.path }}"
      - uses: actions/upload-artifact@v2
        with:
          name: app-${{ matrix.app }}
          path: target/dx/${{ matrix.app }}/release/web/public

  deploy:
    needs: build-apps
    runs-on: codeberg-small
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v2
        with:
          path: raw_artifacts
      - name: Assemble Site Layout
        run: |
          mkdir -p _site
          # Landing page (index) contents at root
          cp -r raw_artifacts/app-index/* _site/
          
          # Move remaining 5 apps to subfolders
          for dir in raw_artifacts/app-*; do
            folder_name="${dir#raw_artifacts/app-}"
            if [ "$folder_name" != "index" ]; then
              mv "$dir" "_site/$folder_name"
            fi
          done
      - uses: actions/git-pages@v2
        with:
          site: https://adafede.codeberg.page/dioxus/
          token: ${{ forge.token }}
          source: _site/
