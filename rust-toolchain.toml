# Pinned Rust toolchain: compiler version, components and targets, installed by
# `rustup` on every machine and CI runner that touches this workspace.
[toolchain]
# Newest stable, verified against
# https://static.rust-lang.org/dist/channel-rust-stable.toml (1.99.0, 2026-09-28;
# channel manifest dated 2026-10-01).
# `./mk msrv` measures the floor (1.97.1) separately; that is what
# `rust-version` claims, and this is what CI compiles with.
channel = "1.99.0"
profile = "minimal"
# `llvm-tools-preview` supplies the `llvm-profdata`/`llvm-cov` pair that
# `cargo llvm-cov nextest` shells out to for the coverage report.
components = ["clippy", "rustfmt", "llvm-tools-preview"]
targets = ["wasm32-unknown-unknown"]
