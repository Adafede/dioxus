name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.9.1

      - uses: cargo-bins/cargo-binstall@v1.20.1

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --version 0.7.9 --locked --force

      - name: Build lotus-explorer
        working-directory: apps/lotus-explorer
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/lotus-explorer/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build hello-world
        working-directory: apps/hello-world
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/hello-world/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build jsoncount
        working-directory: apps/jsoncount
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/jsoncount/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build mgf-precursor-erro-rs
        working-directory: apps/mgf-precursor-erro-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/mgf-precursor-erro-rs/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Assemble site
        run: |
          DX_OUT="target/dx"
          DX_WEB="release/web/public"
          mkdir -p _site
          cp -r "$DX_OUT/lotus-explorer/$DX_WEB" _site/lotus-explorer
          cp -r "$DX_OUT/hello-world/$DX_WEB"    _site/hello-world
          cp -r "$DX_OUT/jsoncount/$DX_WEB"      _site/jsoncount
          cp -r "$DX_OUT/mgf-precursor-erro-rs/$DX_WEB" _site/mgf-precursor-erro-rs
          cp .github/workflows/index-template.html _site/index.html


      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        id: deployment
