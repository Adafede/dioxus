name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: index
            path: "/${REPONAME}/"
          - app: lotus-explore-rs
            path: "/${REPONAME}/lotus-explore-rs/"
          - app: json-count-rs
            path: "/${REPONAME}/json-count-rs/"
          - app: mgf-precursor-erro-rs
            path: "/${REPONAME}/mgf-precursor-erro-rs/"
          - app: smellfish-rs
            path: "/${REPONAME}/smellfish-rs/"
          - app: lipid-selecto-rs
            path: "/${REPONAME}/lipid-selecto-rs/"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.app }}

      - uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm

      # Only run fetch-ketcher for the app that actually uses it
      - name: Fetch Ketcher (lotus-explore-rs only)
        if: matrix.app == 'lotus-explore-rs'
        run: |
          cargo build --release -p lotus-deploy --bin fetch-ketcher
          ../../target/release/fetch-ketcher
        working-directory: apps/lotus-explore-rs

      - name: Build App
        run: |
          REPONAME="${GITHUB_REPOSITORY#*/}"
          EVAL_PATH=$(eval echo "${{ matrix.path }}")
          dx build --release --platform web --debug-symbols false --base-path "$EVAL_PATH"
        working-directory: apps/${{ matrix.app }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-${{ matrix.app }}
          path: target/dx/${{ matrix.app }}/release/web/public

  deploy:
    needs: build-apps
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: _site

      - name: Structure _site directory
        run: |
          mkdir -p _final_site

          # Move base index contents to root of final site directory
          cp -r _site/app-index/* _final_site/
          rm -rf _site/app-index

          # Move remaining apps to subdirectories
          for dir in _site/app-*; do
            app_name="${dir#_site/app-}"
            mv "$dir" "_final_site/$app_name"
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _final_site

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        id: deployment
