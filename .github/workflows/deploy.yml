name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --version 0.7.10 --locked --force

      - name: Build deploy tools
        run: cargo build --release -p lotus-deploy --bin fetch-ketcher

      - name: Fetch Ketcher
        working-directory: apps/lotus-explore-rs
        run: ../../target/release/fetch-ketcher

      - name: Build index landing page
        working-directory: apps/index
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build lotus-explore-rs
        working-directory: apps/lotus-explore-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/lotus-explore-rs/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build json-count-rs
        working-directory: apps/json-count-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/json-count-rs/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build mgf-precursor-erro-rs
        working-directory: apps/mgf-precursor-erro-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/mgf-precursor-erro-rs/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build smellfish-rs
        working-directory: apps/smellfish-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/smellfish-rs/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build lipid-selecto-rs
        working-directory: apps/lipid-selecto-rs
        run: dx build --release --platform web --debug-symbols false --base-path "/${GITHUB_EVENT_REPOSITORY_NAME}/lipid-selecto-rs/"
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Assemble site
        run: |
          DX_OUT="target/dx"
          DX_WEB="release/web/public"
          mkdir -p _site

          # Deploy index as root (landing page)
          cp -r "$DX_OUT/index/$DX_WEB"/* _site/

          # Deploy other apps to subdirectories
          cp -r "$DX_OUT/lotus-explore-rs/$DX_WEB" _site/lotus-explore-rs
          cp -r "$DX_OUT/json-count-rs/$DX_WEB"    _site/json-count-rs
          cp -r "$DX_OUT/mgf-precursor-erro-rs/$DX_WEB" _site/mgf-precursor-erro-rs
          cp -r "$DX_OUT/smellfish-rs/$DX_WEB" _site/smellfish-rs
          cp -r "$DX_OUT/lipid-selecto-rs/$DX_WEB" _site/lipid-selecto-rs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        id: deployment
