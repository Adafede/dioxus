# Deploy the wasm bundles to GitHub Pages.
#
# Every build here is a `./mk web-build` task, the same one a contributor
# runs, so the artifact that is published is the artifact that was checked. The
# deploy adds one thing to it: `BASE_PATH`, because each app is served from its
# own subdirectory and an app built for `/` resolves its assets from `/`.
#
# This is a deploy, not a gate: it runs on `main` and on demand, and nothing
# waits for it. `ci.yml` is what has to be green.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Least privilege, and the only reason this file asks for more than `read`:
# deploying to Pages needs a write to Pages and an OIDC token to prove the deploy
# came from this workflow rather than from somebody with a shell.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and the older one is pointless once a newer push lands.
concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apps:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: index
            pkg: index
          - app: json-count-rs
            pkg: json-count-rs
          - app: mgf-precursor-erro-rs
            pkg: mgf-precursor-erro-rs
          - app: smellfish-rs
            pkg: smellfish-rs
          - app: lipid-selecto-rs
            pkg: lipid-selecto-rs
          - app: cxsmiles-yoga
            pkg: cxsmiles-yoga
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }

      # rustup is preinstalled on the runner, and it reads `rust-toolchain.toml`
      # from the working directory on first use -- including `profile`,
      # `components` and `targets`, verified by deleting a pinned toolchain and
      # running `rustc` in a scratch directory. So the one file that names the
      # compiler is the only file that names it, and this step is what turns a
      # missing toolchain into a named failure rather than a surprise later in
      # the job.
      #
      # It has to come before the cache step, which shells out to `rustc -vV` to
      # key the cache: with no toolchain installed yet, that is the invocation
      # that triggers the install, so the key would be derived from it anyway --
      # but a named step that says so beats relying on a side effect.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with:
          # One key shared by every matrix leg, so the first leg to run pays for
          # compiling the dependency graph and the rest reuse it.
          shared-key: pages

      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: |
            cargo-make@0.37.24
            dioxus-cli@0.7.10

      - name: Build the app
        env:
          APP: ${{ matrix.pkg }}
          BASE_PATH: /${{ github.event.repository.name }}/${{ matrix.pkg }}
        run: ./mk web-build

      # `dx` writes into the one workspace target directory, not under the app's
      # own directory.
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: app-${{ matrix.app }}
          path: target/dx/${{ matrix.pkg }}/release/web/public
          retention-days: 7

  deploy:
    name: Deploy
    needs: build-apps
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          path: _site

      # The landing page is the site root; every other app keeps its own
      # subdirectory, which is what `BASE_PATH` above was built for.
      - name: Arrange the site directory
        run: |
          set -euo pipefail
          mkdir -p _final_site
          cp -r _site/app-index/* _final_site/
          rm -rf _site/app-index
          for dir in _site/app-*; do
            mv "$dir" "_final_site/$(basename "${dir#_site/app-}")"
          done
          ls _final_site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v3
        with:
          path: _final_site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4
        id: deployment