name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["rust"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@d1ba80a13dd99fba24a470575428917156a28b43

      - uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43
