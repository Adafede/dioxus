# The CI gate.
#
# Every job here runs a `./mk` task. The task definitions live in
# `Makefile.toml` and `make/*.toml`, and the local gate is `./mk ci`, so
# there is one list of what "green" means and this file is the runner for it.
# That is the whole point of the arrangement: when the workflow and the local
# command each spelled out the cargo flags, they drifted, and a check that was
# supposed to run locally did not.
#
# `crates/upload/tests/gate_consistency.rs` checks that this file, the `ci` task
# and `prek.toml` name the same set of checks, and fails the build if they do
# not.
#
# Actions are pinned by SHA, not by tag, so a tag that moves cannot change what
# runs on a pull request from a fork. The comment on each pin is the tag.
#
# There is no release workflow. Every crate is `publish = false` and the public
# APIs are still moving, so release, packaging and semver tooling is deferred
# until a first release is actually planned -- see the "Deferred" note in the
# developer docs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing here writes to the repository, creates a release or
# reads a secret, so `contents: read` is the whole grant.
permissions:
  contents: read

# A superseded run on the same ref is cancelled: a push that lands while a
# previous push is still building makes the newer commit's result the one that
# matters, and the older one has nothing left to say.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Every warning is an error. The lint task also passes `-D warnings`; this is
  # what covers rustc's own default-warn group, which that flag does not reach
  # for build scripts and proc macros.
  RUSTFLAGS: "-D warnings"

jobs:
  # ── The gate ────────────────────────────────────────────────────────────────
  # One job that runs `./mk ci`. It is deliberately not eleven jobs: the
  # reason the eleven existed was to report *which* check failed, and a named
  # step plus a JUnit artifact does that without eleven toolchain installs,
  # eleven cargo caches and eleven chances for the runner to be the slow part.
  ci:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }

      # rustup is preinstalled on the runner, and it reads `rust-toolchain.toml`
      # from the working directory on first use -- including `profile`,
      # `components` and `targets`, verified by deleting a pinned toolchain and
      # running `rustc` in a scratch directory. So the one file that names the
      # compiler is the only file that names it, and this step is what turns a
      # missing toolchain into a named failure rather than a surprise later in
      # the job.
      #
      # It has to come before the cache step, which shells out to `rustc -vV` to
      # key the cache: with no toolchain installed yet, that is the invocation
      # that triggers the install, so the key would be derived from it anyway --
      # but a named step that says so beats relying on a side effect.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with:
          # One key shared by every job on the branch, so the first job to run
          # pays for compiling the dependency graph and the rest reuse it. The
          # default is per-job, which shares nothing.
          shared-key: ci

      # The tools the gate calls. `./mk ci` fails on a missing one rather
      # than skipping it, which is deliberate: a supply-chain check that is
      # silently absent on a machine where it is not installed is a check that
      # reports nothing about the code.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: |
            cargo-make@0.37.24
            cargo-nextest@0.9.146
            tombi-cli@1.6.1
            typos-cli@1.50.3
            cargo-hack@0.6.45
            cargo-deny@0.20.2
            cargo-audit@0.22.2
            cargo-machete@0.9.2
            cargo-readme@3.4.0
            panache@3.12.0

      - name: ./mk ci
        run: ./mk ci

      # Without this a failure is a red dot and a scrollback. The path is set in
      # `.config/nextest.toml` as `junit.path`, so the file lands under a
      # per-profile store directory next to the build output.
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: always()
        with:
          name: nextest-junit
          path: target/nextest/ci/
          if-no-files-found: ignore
          retention-days: 14

  # ── MSRV ────────────────────────────────────────────────────────────────────
  # The `rust-version` in the root manifest is a claim; this is the job that
  # checks it. It builds on the oldest toolchain the workspace claims to
  # support, which is the toolchain a downstream consumer is holding.
  #
  # `cargo msrv find` is how that number was arrived at; it is not run here
  # because it bisects with a build per toolchain and belongs on a schedule
  # rather than on every push.
  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with: { shared-key: msrv }
      # Deliberately NOT the pinned toolchain, and deliberately the one place in
      # this workflow that installs a toolchain with the action rather than
      # letting rustup read `rust-toolchain.toml`: the point of this job is the
      # *oldest* supported compiler, so naming it here is the job.
      #
      # `RUSTUP_TOOLCHAIN` is what actually selects it. rustup reads
      # `rust-toolchain.toml` before any action runs, so the env var is what
      # wins, and setting only the action's `toolchain:` input is not enough on
      # its own.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: { toolchain: 1.97.1 }
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: |
            cargo-nextest@0.9.146
            cargo-make@0.37.24
      - run: ./mk check
      - run: ./mk test

  # ── The WASM bundle ─────────────────────────────────────────────────────────
  # Nothing in the gate produces a `.wasm`: the apps are checked and linted for
  # wasm32 but never linked. So nothing in the gate would notice a change that
  # doubled the bundle, and the one build that does produce it is not one
  # anybody runs routinely.
  wasm:
    name: WASM bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }

      # rustup is preinstalled on the runner, and it reads `rust-toolchain.toml`
      # from the working directory on first use -- including `profile`,
      # `components` and `targets`, verified by deleting a pinned toolchain and
      # running `rustc` in a scratch directory. So the one file that names the
      # compiler is the only file that names it, and this step is what turns a
      # missing toolchain into a named failure rather than a surprise later in
      # the job.
      #
      # It has to come before the cache step, which shells out to `rustc -vV` to
      # key the cache: with no toolchain installed yet, that is the invocation
      # that triggers the install, so the key would be derived from it anyway --
      # but a named step that says so beats relying on a side effect.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with: { shared-key: ci }
      # `dioxus-cli` is the crate; `dx` is the binary it installs and is not on
      # crates.io, so `dx@0.7.10` does not resolve. The version is the resolved
      # `dioxus` in `Cargo.lock`, which is the one `dx` has to agree with.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: |
            cargo-make@0.37.24
            dioxus-cli@0.7.10
      - name: Install binaryen for wasm-opt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen
      - run: ./mk web-build-all
      - name: Report the optimized size of each app
        run: ./mk web-size
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: wasm-bundles
          # `dx` writes into the one workspace target directory, not under each
          # app's own, so the path is not `apps/*/target/...`.
          path: target/dx/*/release/web/
          retention-days: 14