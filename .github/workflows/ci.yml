name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Pre-commit checks: fast, block every commit/PR ──────────────────────────

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  check:
    name: Check (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo check --workspace --all-targets --locked

  # ── Pre-push checks: heavy — run on every PR and push ─────────────────────────

  test:
    name: Test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo test --workspace --all-targets --locked --quiet

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo doc --workspace --no-deps --locked

  wasm:
    name: WASM type-check (all apps)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check all WASM apps
        run: |
          cargo check -p json-count-rs --target wasm32-unknown-unknown --locked
          cargo check -p mgf-precursor-erro-rs --target wasm32-unknown-unknown --locked
          cargo check -p lipid-selecto-rs --target wasm32-unknown-unknown --locked
          cargo check -p lotus-explore-rs --target wasm32-unknown-unknown --locked
          cargo check -p smellfish-rs --target wasm32-unknown-unknown --locked

  wasm-build:
    name: WASM build (deploy artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install dioxus-cli
        run: cargo install dioxus-cli
      - name: Fetch Ketcher (115 MB structure editor — gitignored)
        if: hashFiles('apps/lotus-explore-rs/scripts/fetch-ketcher.sh') != ''
        run: |
          bash scripts/fetch-ketcher.sh
        working-directory: apps/lotus-explore-rs
        env:
          KETCHER_VERSION: ${{ vars.KETCHER_VERSION || '3.17.0' }}
      - name: Build all WASM apps
        run: |
          dx build --package json-count-rs --platform web --out-dir dist/json-count-rs --release
          dx build --package mgf-precursor-erro-rs --platform web --out-dir dist/mgf-precursor-erro-rs --release
          dx build --package lipid-selecto-rs --platform web --out-dir dist/lipid-selecto-rs --release
          dx build --package lotus-explore-rs --platform web --out-dir dist/lotus-explore-rs --release
          dx build --package smellfish-rs --platform web --out-dir dist/smellfish-rs --release

  supply-chain:
    name: Supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with: { tool: cargo-deny@0.19.4,cargo-audit@0.22.1 }
      - name: Show tool versions
        run: |
          cargo deny --version
          cargo audit --version
      - name: Cargo deny
        run: cargo deny check advisories bans licenses sources
      - name: Cargo audit
        run: cargo audit

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-machete
        run: cargo install cargo-machete
      - run: cargo machete check --workspace
