name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }} # binstall rate limits

jobs:
  ci:
    name: ./mk ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semver compares with the last tag; commits, ratchet and mutants-diff with the base branch
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          tier: ci

      - name: Run blocking gates
        run: ./mk ci

      # nextest writes a JUnit report (see .config/nextest.toml), so a failure names its test.
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        if: always()
        with:
          name: nextest-junit
          path: target/nextest/ci/
          if-no-files-found: ignore
          retention-days: 14

  # Repository jobs beyond the standard gate.
  # ── The WASM bundle ─────────────────────────────────────────────────────────
  # Nothing in the gate produces a `.wasm`: the apps are checked and linted for
  # wasm32 but never linked. So nothing in the gate would notice a change that
  # doubled the bundle, and the one build that does produce it is not one
  # anybody runs routinely.
  wasm:
    name: WASM bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with: { persist-credentials: false, fetch-depth: 1 }

      # rustup is preinstalled on the runner, and it reads `rust-toolchain.toml`
      # from the working directory on first use -- including `profile`,
      # `components` and `targets`, verified by deleting a pinned toolchain and
      # running `rustc` in a scratch directory. So the one file that names the
      # compiler is the only file that names it, and this step is what turns a
      # missing toolchain into a named failure rather than a surprise later in
      # the job.
      #
      # It has to come before the cache step, which shells out to `rustc -vV` to
      # key the cache: with no toolchain installed yet, that is the invocation
      # that triggers the install, so the key would be derived from it anyway --
      # but a named step that says so beats relying on a side effect.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8
        with: { shared-key: ci }
      # `dioxus-cli` is the crate; `dx` is the binary it installs and is not on
      # crates.io, so `dx@0.7.10` does not resolve. The version is the resolved
      # `dioxus` in `Cargo.lock`, which is the one `dx` has to agree with.
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: |
            cargo-make@0.37.24
            dioxus-cli@0.7.10
      - run: ./mk web-build-all
      - name: Report the optimized size of each app
        run: ./mk web-size
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: wasm-bundles
          # `dx` writes into the one workspace target directory, not under each
          # app's own, so the path is not `apps/*/target/...`.
          path: target/dx/*/release/web/
          retention-days: 14
