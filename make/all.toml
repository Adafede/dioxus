# Every task file, in one list, so `extend` stays a single string. cargo-make
# 0.37.24 takes one path here, hence this one-line indirection rather than a list
# of eight paths in the root file. Verified against cargo-make 0.37.24.
extend = [
  { path = "format.toml" },
  { path = "lint.toml" },
  { path = "build.toml" },
  { path = "test.toml" },
  { path = "supply-chain.toml" },
  { path = "web.toml" },
  { path = "readme.toml" },
]
