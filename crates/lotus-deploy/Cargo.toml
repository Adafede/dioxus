[package]
name = "lotus-deploy"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Host-only deploy helpers for lotus-explore-rs: bake <html lang> into shipped index.html and fetch/slim the Ketcher editor bundle"
repository = { workspace = true }
license = { workspace = true }
keywords = ["deploy", "dioxus", "i18n", "ketcher", "lotus"]
categories = ["development-tools::build-utils", "web-programming"]
publish = false

# Independent host-only binary; build with
# `cargo build --release -p lotus-deploy --bin fetch-ketcher`.
[[bin]]
name = "fetch-ketcher"
path = "src/fetch_ketcher.rs"

[dependencies]
# `blocking` so the deploy helper needs no async runtime of its own. The `gzip`
# feature is inherited from the workspace; `blocking` is added here.
reqwest = { workspace = true, features = ["blocking"] }
zip = { workspace = true }

[lints]
workspace = true

# ── Release profile — tiny WASM ───────────────────────────────────────────────
[profile.release]
opt-level = "z"
debug = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
