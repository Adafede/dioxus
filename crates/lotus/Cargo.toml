[package]
name = "lotus"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "LOTUS domain models, SPARQL query construction, and result parsing for Wikidata/QLever"
license = "AGPL-3.0-only"
keywords = ["lotus", "natural-products", "sparql", "wasm", "wikidata"]
categories = ["science", "web-programming"]
publish = false

[dependencies]
bytes = { workspace = true }
csv = { workspace = true }
log = { workspace = true }
upload = { path = "../upload", version = "0.1" }
urlencoding = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
reqwest = { workspace = true, features = [] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Window"] }

[lints]
workspace = true
