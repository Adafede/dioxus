[package]
name = "upload"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Streaming file upload, blob scanning, progress reporting, and download primitives for WASM apps"
license = "AGPL-3.0-only"
keywords = ["blob", "drag-drop", "file-upload", "streaming", "wasm"]
categories = ["asynchronous", "web-programming"]
publish = false

[dependencies]
dioxus = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "File", "FileList", "FileReader", "HtmlAnchorElement", "HtmlFormElement", "HtmlInputElement", "Location", "Url", "Window"] }

[lints]
workspace = true

# ── Release profile — tiny WASM ───────────────────────────────────────────────
[profile.release]
opt-level = "z"
debug = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
