[package]
name = "upload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Streaming file upload, blob scanning, progress reporting, and download primitives for WASM apps"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["blob", "drag-drop", "file-upload", "streaming", "wasm"]
categories = ["asynchronous", "web-programming"]
publish = false

[dependencies]
dioxus = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "File", "FileList", "FileReader", "HtmlAnchorElement", "HtmlFormElement", "HtmlInputElement", "Location", "Url", "Window"] }

[lints]
workspace = true
