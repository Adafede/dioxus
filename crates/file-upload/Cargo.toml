[package]
name = "file-upload"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Streaming file upload and blob handling primitives for WASM file upload apps"
license = "AGPL-3.0-only"
keywords = ["wasm", "blob", "file-upload", "streaming", "drag-drop"]
categories = ["web-programming", "asynchronous"]
publish = false

[dependencies]
dioxus = { workspace = true }
gloo-timers = { version = "0.3", features = ["futures"] }
log = { workspace = true }
shared = { path = "../shared", version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Blob", "File", "FileList", "FileReader", "HtmlAnchorElement", "HtmlInputElement", "Url", "Window"] }

[lints]
workspace = true