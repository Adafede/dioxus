# nextest profiles. Read automatically from `.config/nextest.toml`; see
# https://nexte.st/book/configuration.html
#
# nextest runs each test in its own process, in parallel, and unlike
# `cargo test` it does not run doctests. The doctest step is therefore a
# separate command everywhere nextest appears: `./mk test`, `./mk
# ci-fast`, CI, the git hooks and the contributor docs. A forgotten doctest step
# is invisible, because a passing test run and a complete one look the same.
#
# Several settings that used to live in this file are command-line flags in
# current nextest, and nextest warns about them as unknown keys:
# `junit-path`, `no-fail-fast` and `default-test-threads`. Those flags are on the
# tasks in `make/test.toml` and `junit.path` is the key below. Verified against
# cargo-nextest 0.9.146 rather than assumed.

# The everyday loop: stop at the first failure, and do not spend the time a
# report costs on a run that is already known to be red.
[profile.default]
fail-fast = true

[[profile.default.overrides]]
slow-timeout = { period = "120s" }
filter = "package(cxsmiles-yoga)"

# What CI runs. Every difference from `default` is about producing a verdict
# someone else can read rather than one you can read.
[profile.ci]
# A red test is a red test. A retry would hide a flake behind a green build, and
# the flake would be found later, in someone's release, rather than here.
retries = 0
# Run everything even after a failure: the JUnit report is only useful if it
# says *which* of the failing tests failed, not just that something did. The
# flag is `--no-fail-fast`; `fail-fast = false` on its own is not enough.
fail-fast = false
# The machine-readable report CI uploads as an artifact. Without it a failure is
# a red dot and a scrollback. The path is relative to a per-profile store
# directory next to the build output, so the file lands at
# `target/nextest/ci/ci-junit.xml`.
junit.path = "ci-junit.xml"
# Per-test progress nobody reads while a pipeline is deciding whether it is
# green.
status-level = "fail"
final-status-level = "fail"
# A test that has not finished in this long is hung, not slow, and the job
# should fail with a name rather than sit until the runner's own timeout.
slow-timeout = { period = "60s" }

# ── Per-test overrides ───────────────────────────────────────────────────────
# A group of tests that is legitimately slower than the period above. A timeout
# that fires on a test doing its job is a timeout that trains people to ignore
# timeouts, so the group is named here rather than by leaving the limit generous
# for everything.
#
# `cxsmiles-yoga`'s positional and repeat searches are the slow group: they build
# and canonicalise molecules, which is the one place in this workspace where a
# test can take seconds rather than milliseconds. A 60 s ceiling is not close on
# a loaded CI runner, and a test killed at 60 s reports a timeout rather than the
# molecule it was working on.
[[profile.ci.overrides]]
slow-timeout = { period = "120s" }
filter = "package(cxsmiles-yoga)"

# `./mk test-live`: the `#[ignore]`d network tests.
#
# There are none today, and that is a decision rather than an oversight: the
# SPARQL layer is tested through `lotus-search`'s scripted transport against a
# recorded conversation, so no test needs to reach a live endpoint. This profile
# is where a test that genuinely has to reach one goes, so that it is opt-in and
# never in CI by default.
#
# No retries here either: a network test that failed once and passed on a retry
# has still told you something, and the honest thing is to say it.
#
# `--run-ignored only` has no profile equivalent, which is why `./mk
# test-live` is what pairs this profile with it. The profile alone would run
# every non-ignored test, which is the `ci` profile under another name and not
# what the task claims to do.
[profile.live]
retries = 0
fail-fast = false
status-level = "fail"
final-status-level = "fail"
# Anything reaching a real endpoint deserves more room than a fixture does.
slow-timeout = { period = "300s" }
