[workspace]
# Resolver 3, not 2: it is the edition-2024 resolver, and its one behavioural
# change over 2 is MSRV-aware version selection — a dependency is not resolved to
# a version that needs a newer compiler than `rust-version` claims. Without it a
# `cargo update` can quietly raise the workspace's real MSRV, and the MSRV CI job
# is the thing that finds out.
resolver = "3"

members = [
  "apps/cxsmiles-yoga",
  "apps/index",
  "apps/json-count-rs",
  "apps/lipid-selecto-rs",
  # A rule-evolution tool, not an app. Out of the workspace because it pulls in
  # `reqwest`/`tokio`/`zip` for a binary that runs on a laptop against downloaded
  # LIPID MAPS data; its own `Cargo.toml` still uses the workspace dependency
  # table, so it builds when the line above is uncommented.
  # "apps/lipid-selecto-rs/lipidmaps/smarts-evoliposuction",
  "apps/mgf-precursor-erro-rs",
  "apps/smellfish-rs",
  "crates/ui",
  "crates/upload",
]

# The metadata every crate inherits. Each crate overrides `description`,
# `keywords` and `categories`, because those are the three that are actually
# per-crate; the rest are the same everywhere and one place is one answer.
[workspace.package]
version = "0.1.0"
edition = "2024"
# The real floor, measured: `./mk msrv` bisects the workspace to 1.97.1.
# 1.97 is what is claimed so that any 1.97.x satisfies it.
rust-version = "1.97"
readme = "README.md"
repository = "https://github.com/adafede/dioxus"
# `homepage` is deliberately not set: the Cargo book says it should only be used
# for a site that is neither the repository nor the docs, and this repository has
# no such site.
#
# `authors` is not set either. Cargo documents it as deprecated, and it is only
# read for `CARGO_PKG_AUTHORS` in a build script, which nothing here uses.
license = "AGPL-3.0-only"

# ── Shared dependency versions ────────────────────────────────────────────────
[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
dioxus = { version = "0.7", features = ["web"] }
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
# The transport and query crates of the LOTUS explorer, consumed by
# `apps/smellfish-rs`. Tracked on a branch rather than a rev so the app keeps
# up with a crate that is still being split up; the lockfile pins the exact
# commit, and `./mk mutants` and CI are what notice an API moving
# underneath.
lotus-search = { git = "https://github.com/lotusnprod/lotus-explore-rs", branch = "main", version = "0.1" }
rand = "0.10"
rayon = "1.12"
reqwest = { version = "0.13", features = ["gzip"] }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs"] }
urlencoding = "2.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# A dotted key rather than an inline table, because a multi-line inline table is
# TOML 1.1 and Cargo accepts it while most other tools do not: taplo reports a
# syntax error on it, and cargo-make prints "Unable to parse Cargo.toml" on
# every invocation. This form is TOML 1.0 and parses everywhere.
web-sys.version = "0.3"
web-sys.features = [
  "Blob",
  "BlobPropertyBag",
  "Document",
  "Element",
  "File",
  "FileList",
  "FileReader",
  "HtmlAnchorElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Location",
  "MediaQueryList",
  "Performance",
  "Url",
  "Window",
]
zip = "8.6"

# ── Clippy lints ───────────────────────────────────────────────────────────────
# All, pedantic, cargo denied by default; nursery warned (unstable, evaluated per
# occurrence). Restriction lints are NOT enabled wholesale — selected individually
# per project needs, each justified below.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Individual pedantic lints we want stricter control over
dbg_macro = "deny"
# Every `v[i]` and `&v[a..b]` is a panic site that survives review by reading the
# surrounding code. Enabling it cost 201 sites: 157 that a host `cargo clippy`
# sees, and 44 more that only a `wasm32` build compiles. Every one is now either
# an `Option`-returning form or a scoped `#[allow]` that names the invariant that
# makes the index sound — the union-find in `cxsmiles-yoga`, the permutation
# inversion in its positional builder, the histogram bins in `mgf-precursor-erro-rs`
# — and the exceptions are visible in a `grep` rather than implied by a lint that
# was switched off.
indexing_slicing = "deny"
# An assertion without a message leaves the next reader guessing which of the
# values in the expression was wrong.
missing_assert_message = "deny"
missing_const_for_fn = "warn"
module_name_repetitions = "warn"
needless_lifetimes = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
similar_names = "warn"
# `unsafe_code` is `forbid`, so there is no unsafe block to leave unexplained.
# The lint stays denied so that a future `#[allow(unsafe_code)]` cannot quietly
# reintroduce one without a justification beside it.
undocumented_unsafe_blocks = "deny"
# A non-NFC identifier means two spellings of one name, which is a silent
# duplicate-key class of bug in the map and set keys these apps are built on.
unicode_not_nfc = "deny"

fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"

expect_used = "deny"
# `panic` lint: `panic!` in hot paths aborts the WASM app; build scripts are
# exempted at their call sites (build failure must abort the build).
panic = "deny"
# ── Restriction tier (selected individually; these are opinionated by design) ──
# Panics in a WASM frontend abort the whole app into a blank screen, so every
# reachable panic site is a real defect. Enabled: `panic`, `unwrap_used`,
# `expect_used`, `indexing_slicing`. Deliberately NOT enabled:
# - `missing_docs_in_private_items` — valuable but enumerated below; the
#   workspace self-generates READMEs from public/fn-level docs already.
# - `missing_docs` (rust lint) — every crate here is `publish = false` and its
#   `pub` surface is `pub(crate)`; the READMEs are generated from module-level
#   `//!` docs instead, so a per-item requirement would be 1,000+ doc comments
#   on items nobody outside the crate can name.
# - `todo` / `unimplemented` — deny below: landing one is a build break.
todo = "deny"
unimplemented = "deny"
unnecessary_wraps = "deny"
unwrap_used = "deny"
use_self = "deny"

# Cargo hygiene
cargo_common_metadata = "warn"
lint_groups_priority = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Multiple crate versions can occur due to dioxus's optional features using
# different versions of const-serialize (0.7.2 vs 0.8.0-alpha). This is an
# infrastructure issue with dependent crates, not a code quality issue.
# Fixing this requires updating dioxus or its feature flags upstream.
multiple_crate_versions = "allow"
must_use_candidate = "deny"
too_many_lines = "warn"
wildcard_imports = "warn"

# Cast lints
cast_lossless = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "warn"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# `suboptimal_flops` moved from `nursery` into `pedantic` in clippy 1.99 and is
# allowed back out. All six sites it finds here are the same line of arithmetic:
# padding a plot axis by a percentage of its span, `min - span * 0.05`. A fused
# multiply-add buys one FMA on a computation that runs once per plot, and it
# changes the result in the last bit -- two roundings become one -- so adopting it
# would be a behaviour change in exchange for nothing. The lint's premise is that
# the arithmetic is hot enough for the rounding to matter, and no site here is.
suboptimal_flops = "allow"

# Other pedantic lints
default_trait_access = "deny"
derive_partial_eq_without_eq = "deny"
doc_markdown = "deny"
duration_suboptimal_units = "deny"
explicit_iter_loop = "deny"
float_cmp = "deny"
format_push_string = "deny"
# `future_not_send` is denied at the workspace level but suppressed at the
# crate level for wasm async functions that capture non-Send browser futures.
future_not_send = "deny"
if_not_else = "deny"
ignored_unit_patterns = "deny"
items_after_statements = "deny"
large_types_passed_by_value = "deny"
manual_let_else = "deny"
manual_string_new = "deny"
map_unwrap_or = "deny"
match_same_arms = "deny"
needless_raw_string_hashes = "deny"
no_effect_underscore_binding = "deny"
option_as_ref_cloned = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
# `redundant_pub_crate` is disabled because it is unsatisfiable alongside
# `unreachable_pub` below: its only suggested fix is to widen an item to `pub`,
# which `unreachable_pub` then rejects. For an item in a private module that
# must stay visible crate-wide, `pub(crate)` and `pub(super)` are the *same*
# visibility and both are flagged. `unreachable_pub` is the lint that actually
# enforces a minimal exported surface, so it stays denied.
redundant_pub_crate = "allow"
semicolon_if_nothing_returned = "deny"
significant_drop_tightening = "deny"
single_match_else = "deny"
single_option_map = "deny"
struct_field_names = "deny"
trivially_copy_pass_by_ref = "deny"
unchecked_time_subtraction = "deny"
uninlined_format_args = "deny"
unnecessary_struct_initialization = "deny"
unnested_or_patterns = "deny"
unreadable_literal = "deny"
unused_async = "deny"
unused_self = "deny"

# ── Rust lints ────────────────────────────────────────────────────────────────
[workspace.lints.rust]
# An item nothing can reach is either unfinished work or a leftover. Either way
# it should be a deliberate decision at review time, not silence.
dead_code = "deny"
# `_ = expr` drops the value immediately, which for a type with a `Drop` impl
# skips whatever the drop was for — a lock released early, a file truncated
# before the error is reported. The explicit form (`drop(x)`, or a real binding)
# says which was meant.
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
# The 2021/2024 idiom lints as a group: `elided_lifetimes_in_paths`,
# `bare_trait_objects`, `unused_extern_crates` and the rest. Enabled as a group
# rather than one at a time because each is a one-line change when it fires and
# the group is the set of things that edition 2024 made the default.
rust_2018_idioms = { level = "deny", priority = -1 }
# `missing_docs` is disabled because this is an internal project collection,
# not a published library. Documentation is provided at module/API level
# where it adds value, not on every private struct field.
# missing_docs = "warn"  # Disabled: internal project
# `unreachable_pub` is enabled at workspace level for visibility auditing
unreachable_pub = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# `unused_qualifications` is deliberately NOT enabled. It fires inside the
# `rsx!` macro expansion, where a glob-imported type in a closure annotation
# reads as an unnecessary path segment: 31 of the 36 sites it finds here are
# `move |evt: Event<MouseData>|` inside an `rsx!` block, and the suggestion it
# offers is to delete the `onclick:` attribute along with the path. A lint whose
# fix is wrong on five sites out of six trains people to ignore it, so the five
# real qualifications were fixed by hand and the lint stays off.
# `unused_crate_dependencies` is deliberately NOT enabled. These apps are
# browser targets: a host `cargo check` does not compile the
# `#[cfg(target_arch = "wasm32")]` branches where most of them are used, so the
# lint reports `chematic`, `gloo-timers`, `csv`, `futures` and `lotus-search` as
# unused in exactly the builds that cannot see the use. The question it asks —
# "is this dependency referenced by any of this crate's source?" — is the one
# `cargo machete` already answers correctly from the source text, and
# `./mk ci`
# runs that. Turning the lint on here would mean either `use x as _;` in every
# app or a permanently red gate, and neither makes an unused dependency go away.

# ── Profiles ─────────────────────────────────────────────────────────────────
# The three below are the only ones; everything else is a Cargo default, and a
# setting that equals its default is a line to keep in sync for nothing.

# `dx serve` and `cargo test` both run through `dev`, and both are dominated by
# dependency code rather than by this workspace's own. Debug builds of a
# dependency at `opt-level = 0` are the reason `./mk test` takes seconds
# per chemistry-heavy test rather than milliseconds.
[profile.dev]

# Optimise only the dependencies, never this workspace's own crates: a debug
# build of our code is what makes the backtraces and the `dx serve` reload
# usable, and `opt-level` on it defeats both.
[profile.dev.package."*"]
opt-level = 2
# Dependencies still build with debug info. An optimised dependency with no
# debuginfo is a dependency whose panic message names an address.
debug = 1

# The shipped wasm build, which is what `./mk web-build` produces.
#
# `opt-level` is measured rather than assumed, because "z" and "s" are a real
# size/speed trade. Measured rather than guessed, on `cxsmiles-yoga`, whose
# canonicalisation is the hot path of every chemistry app here:
#
#   linked wasm, `cargo build --profile wasm-release -p index --target
#   wasm32-unknown-unknown`:  1 331 592 bytes at "s", 1 260 661 at "z" — 5.3%
#   cxsmiles-yoga's own 124 tests:  0.72 s at "s", 1.34 s at "z" — 1.9x
#
# 5% of a download is not worth nearly doubling the time the app spends working.
# Note that the Dioxus CLI post-processes the bundle, which narrows the size gap
# to nothing in the shipped artefact; the speed difference is in our own code and
# survives it.
# `./mk web-size` re-measures the shipped bundles on demand.
#
# `panic = "abort"` is compatible here and not everywhere: two apps wrap a
# third-party parse in `catch_unwind` (`lipid-selecto-rs`'s class rule parsing,
# `mgf-precursor-erro-rs`'s mass arithmetic), and abort turns that recovery into
# a dead tab. The builds those two ship are `wasm-release` below, which keeps
# unwinding; this profile is what `cargo build --release` on the host and the
# generic wasm path use, and neither goes near a `catch_unwind`.
[profile.release]
opt-level = "z"
# No debuginfo: nothing in a released wasm bundle is ever stepped through in a
# debugger, and the sections are megabytes.
debug = false
strip = "symbols"
lto = true
panic = "abort"
incremental = false
codegen-units = 1

# What the browser apps are actually built with, by `./mk web-build` and by
# the Dioxus CLI's `--release`.
#
# The difference from `release` is the one line that matters: `panic = "abort"`
# is dropped. Two of the six apps recover from a panic in a third-party parser
# with `catch_unwind`, and under `abort` that recovery is a blank tab rather
# than an error message — which is a behaviour change caused by a profile, and
# the kind that only shows up in the browser.
[profile.wasm-release]
inherits = "release"
# See the measurement above for why this is "s" and not "z".
opt-level = "s"
# `strip = "debuginfo"`, overriding the `"symbols"` inherited from `release`.
# Not `"none"`, and not `"symbols"`, and the difference between the three is
# worth the paragraph.
#
# LLVM 23 — the one in Rust 1.99 — changed the `strip` codegen option so that
# removing symbols also removes *all* custom sections. One of them is
# `__wasm_bindgen_unstable`, the metadata `wasm-bindgen` reads to generate the
# bindings, so `"symbols"` makes the very next step fail:
#
#   error: failed to read wasm-bindgen data from cxsmiles-yoga.wasm
#   the `__wasm_bindgen_unstable` custom section is missing, but the module
#   still contains wasm-bindgen shims
#
# wasm-bindgen's message names the cause. On Rust 1.98 (LLVM 22) `"symbols"`
# removed only the symbol sections, so it worked and nobody looked.
#
# `"debuginfo"` is the value that keeps the custom sections and still strips the
# DWARF, and the DWARF is where the size was. Measured across all six bundles,
# after `dx build`'s own `wasm-opt -Oz --debuginfo`:
#
#   strip = "symbols"    4 499 987 bytes   broken on 1.99, wasm-bindgen errors
#   strip = "none"       6 875 025 bytes   +53%: the custom sections and the
#                                          unstripped debug info
#   strip = "debuginfo"  4 481 148 bytes   this one, and 0.4% smaller than
#                                          "symbols" ever produced
#
# So "symbols" was buying nothing that "debuginfo" does not buy, and costing the
# ability to build at all.
strip = "debuginfo"
panic = "unwind"
