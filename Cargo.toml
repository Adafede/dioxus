[workspace]
resolver = "2"
members = [
  "apps/cxsmiles-yoga",
  "apps/index",
  "apps/json-count-rs",
  "apps/lipid-selecto-rs",
  "apps/lipid-selecto-rs/lipidmaps/smarts-evoliposuction",
  "apps/lotus-api",
  "apps/lotus-explore-rs",
  "apps/mgf-precursor-erro-rs",
  "apps/smellfish-rs",
  "crates/lipidsdl",
  "crates/lotus",
  "crates/ui",
  "crates/upload",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/adafede/dioxus"
license = "AGPL-3.0-only"

# ── Shared dependency versions ────────────────────────────────────────────────
[workspace.dependencies]
axum = "0.8"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
console_log = "1.1"
csv = "1.4"
dioxus = { version = "=0.7.10", features = ["web"] }
dioxus-i18n = "0.5"
env_logger = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
log = "0.4"
rand = "0.10"
rayon = "1.12"
reqwest = { version = "0.13", features = ["gzip"] }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.53"
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-full", "cors", "request-id", "trace"] }
tracing = "0.1"
urlencoding = "2.1"
utoipa = { version = "5.5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
zip = "8.6"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
needless_lifetimes = "warn"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
use_self = "warn"

cargo_common_metadata = "warn"
lint_groups_priority = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# High-noise / style-opinion lints intentionally relaxed to keep signal high.
module_name_repetitions = "warn"
# Keep this lint enabled; unavoidable transitive duplicates are allowlisted in
# `clippy.toml` via `allowed-duplicate-crates`.
multiple_crate_versions = "warn"
must_use_candidate = "warn"
similar_names = "warn"
too_many_lines = "warn"
wildcard_imports = "warn"

cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
default_trait_access = "warn"
derive_partial_eq_without_eq = "warn"
# Additional broad-noise lints discovered under full workspace + all-target checks.
doc_markdown = "warn"
duration_suboptimal_units = "warn"
explicit_iter_loop = "warn"
float_cmp = "warn"
fn_params_excessive_bools = "warn"
format_push_string = "warn"
future_not_send = "warn"
if_not_else = "warn"
ignored_unit_patterns = "warn"
items_after_statements = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
option_as_ref_cloned = "warn"
option_if_let_else = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
redundant_pub_crate = "warn"
semicolon_if_nothing_returned = "warn"
significant_drop_tightening = "warn"
single_match_else = "warn"
single_option_map = "warn"
struct_excessive_bools = "warn"
struct_field_names = "warn"
trivially_copy_pass_by_ref = "warn"
unchecked_time_subtraction = "warn"
uninlined_format_args = "warn"
unnecessary_struct_initialization = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unused_async = "warn"
unused_self = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

# ── Benchmarking profile — optimized but with symbols for profiling ─────────
[profile.bench]
inherits = "release"
debug = true
strip = "none"
codegen-units = 16

[profile.dev]
opt-level = 1

# ── Release profile — tiny WASM ───────────────────────────────────────────────
[profile.release]
opt-level = "z"
debug = false
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1

# ── Testing profile — faster compilation, better diagnostics ─────────────────
[profile.test]
opt-level = 1
lto = "thin"
