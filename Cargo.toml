[workspace]
resolver = "2"
members = [
  "apps/cxsmiles-yoga",
  "apps/index",
  "apps/json-count-rs",
  "apps/lipid-selecto-rs",
  # "apps/lipid-selecto-rs/lipidmaps/smarts-evoliposuction",
  "apps/mgf-precursor-erro-rs",
  "apps/smellfish-rs",
  "crates/ui",
  "crates/upload",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/adafede/dioxus"
license = "AGPL-3.0-only"

# ── Shared dependency versions ────────────────────────────────────────────────
[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
dioxus = { version = "0.7", features = ["web"] }
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
rand = "0.10"
rayon = "1.12"
reqwest = { version = "0.13", features = ["gzip"] }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs"] }
urlencoding = "2.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = {
  version = "0.3",
  features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Location",
    "MediaQueryList",
    "Performance",
    "Url",
    "Window",
  ]
}
zip = "8.6"

[workspace.lints.clippy]
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
needless_lifetimes = "warn"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"
unnecessary_wraps = "deny"
use_self = "deny"

cargo_common_metadata = "warn"
lint_groups_priority = "warn"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
module_name_repetitions = "deny"
multiple_crate_versions = "allow"
must_use_candidate = "deny"
similar_names = "deny"
too_many_lines = "warn"
wildcard_imports = "warn"

cast_lossless = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "warn"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
default_trait_access = "deny"
derive_partial_eq_without_eq = "deny"
doc_markdown = "deny"
duration_suboptimal_units = "deny"
explicit_iter_loop = "deny"
float_cmp = "deny"
fn_params_excessive_bools = "deny"
format_push_string = "deny"
# `future_not_send` is denied at the workspace level but suppressed at the
# crate level for wasm async functions that capture non-Send browser futures.
future_not_send = "deny"
if_not_else = "deny"
ignored_unit_patterns = "deny"
items_after_statements = "deny"
large_types_passed_by_value = "deny"
manual_let_else = "deny"
manual_string_new = "deny"
map_unwrap_or = "deny"
match_same_arms = "deny"
missing_const_for_fn = "deny"
needless_pass_by_ref_mut = "deny"
needless_pass_by_value = "deny"
needless_raw_string_hashes = "deny"
no_effect_underscore_binding = "deny"
option_as_ref_cloned = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_pub_crate = "deny"
semicolon_if_nothing_returned = "deny"
significant_drop_tightening = "deny"
single_match_else = "deny"
single_option_map = "deny"
struct_excessive_bools = "deny"
struct_field_names = "deny"
trivially_copy_pass_by_ref = "deny"
unchecked_time_subtraction = "deny"
uninlined_format_args = "deny"
unnecessary_struct_initialization = "deny"
unnested_or_patterns = "deny"
unreadable_literal = "deny"
unused_async = "deny"
unused_self = "deny"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

# ── Release profile — tiny WASM ───────────────────────────────────────────────
[profile.release]
opt-level = "z"
debug = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
