# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Fast checks run on every commit; heavy/long checks run only on push.
default_stages = ["pre-commit"]
fail_fast = false

# ── Pre-commit hooks: fast, block every commit ────────────────────────────────

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "check-added-large-files", args = ["--maxkb=2048"] }, { id = "check-case-conflict" }, { id = "check-merge-conflict" }, { id = "check-symlinks" }, { id = "check-executables-have-shebangs" }, { id = "check-shebang-scripts-are-executable" }, { id = "check-toml" }, { id = "check-json" }, { id = "check-yaml" }, { id = "end-of-file-fixer", exclude = "(public/assets/)" }, { id = "mixed-line-ending" }, { id = "trailing-whitespace", exclude = "(public/assets/)" }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.49.0"
hooks = [{ id = "typos" }]

[[repos]]
repo = "local"
hooks = [
  # ── Fast Rust checks (pre-commit) ──────────────────────────────────────────
  { id = "cargo-fmt-check", name = "cargo-fmt-check", language = "system", entry = "cargo fmt --all -- --check", pass_filenames = false, always_run = true, files = "(?!.*public/assets/).*$" },
  { id = "cargo-check", name = "cargo-check", language = "system", entry = "cargo check --workspace --all-targets --locked", pass_filenames = false, always_run = true, files = "(?!.*public/assets/).*$" },
  { id = "cargo-clippy", name = "cargo-clippy", language = "system", entry = "cargo clippy --workspace --all-targets --locked -- -D warnings", pass_filenames = false, always_run = true, files = "(?!.*public/assets/).*$" },

  # ── Heavy Rust checks (pre-push only) ──────────────────────────────────────
  # These are slow or require special toolchains; they run on every push
  # to any branch, not on every commit.
  { id = "cargo-test", name = "cargo-test", language = "system", entry = "cargo test --workspace --all-targets --locked", pass_filenames = false, always_run = true, stages = ["pre-push"] },
  { id = "cargo-check-wasm-all", name = "cargo-check-wasm-all", language = "system", entry = "cargo check --workspace --target wasm32-unknown-unknown --locked", pass_filenames = false, always_run = true, stages = ["pre-push"] },
  { id = "cargo-doc", name = "cargo-doc", language = "system", entry = "cargo doc --workspace --no-deps --locked", pass_filenames = false, always_run = true, stages = ["pre-push"] },

  # ── Supply chain (pre-push only) ───────────────────────────────────────────
  { id = "cargo-machete", name = "cargo-machete", language = "system", entry = "sh -c 'if command -v cargo-machete >/dev/null 2>&1; then cargo machete check --workspace; else echo \"cargo-machete not installed; skipping\"; fi'", pass_filenames = false, always_run = true, stages = ["pre-push"] },
  { id = "cargo-audit", name = "cargo-audit", language = "system", entry = "sh -c 'if command -v cargo-audit >/dev/null 2>&1; then cargo audit; else echo \"cargo-audit not installed; skipping\"; fi'", pass_filenames = false, always_run = true, stages = ["pre-push"] },
  { id = "cargo-deny", name = "cargo-deny", language = "system", entry = "sh -c 'if command -v cargo-deny >/dev/null 2>&1; then cargo deny check advisories bans licenses sources; else echo \"cargo-deny not installed; skipping\"; fi'", pass_filenames = false, always_run = true, stages = ["pre-push"] },
  { id = "cargo-outdated", name = "cargo-outdated", language = "system", entry = "sh -c 'if command -v cargo-outdated >/dev/null 2>&1; then cargo outdated --workspace --exit-code 1; else echo \"cargo-outdated not installed; skipping\"; fi'", pass_filenames = false, always_run = true, stages = ["pre-push"] },

  # ── README verification (pre-push only) ────────────────────────────────────
  # Generates all READMEs from cargo-readme templates, lints them with
  # `panache lint`, and verifies they are in sync with source doc comments.
  # If panache changes a generated README, fix the source `//!` doc comments
  # in lib.rs/main.rs, then re-run cargo readme to regenerate.
  { id = "cargo-readme-panache", name = "cargo-readme-panache", language = "system", entry = "sh -c 'if ! command -v cargo-readme >/dev/null 2>&1; then echo \"cargo-readme not installed; skipping\"; exit 0; fi; if ! command -v panache >/dev/null 2>&1; then echo \"panache not installed; skipping\"; exit 0; fi; for d in crates/lotus crates/ui crates/upload apps/index apps/lotus-api apps/lotus-explore-rs apps/json-count-rs apps/lipid-selecto-rs apps/mgf-precursor-erro-rs apps/smellfish-rs; do (cd \"$d\" && cargo readme -t README.tpl -o /tmp/readme_panache.md 2>/dev/null || exit 1; panache lint /tmp/readme_panache.md || exit 1; if ! diff -q /tmp/readme_panache.md README.md > /dev/null 2>&1; then echo \"README.md out of date for $d — run: (cd $d && cargo readme -t README.tpl -o README.md)\"; exit 1; fi) || exit 1; done'", pass_filenames = false, always_run = true, stages = ["pre-push"] }
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.3.5"
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

[[repos]]
repo = "https://github.com/jolars/panache-pre-commit"
rev = "v3.3.0"
hooks = [{ id = "panache-format" }, { id = "panache-lint" }]
